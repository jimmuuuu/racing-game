<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>BRAINROT RACING</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Segoe UI',sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#ui{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;display:flex;align-items:center;justify-content:center;z-index:10}
#ui>div{pointer-events:auto}
.screen{display:none;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;padding:20px;overflow-y:auto}
.screen.active{display:flex}
.title{font-size:clamp(24px,5vw,56px);font-weight:900;color:#fff;text-shadow:0 0 20px #f0f,0 0 40px #0ff,3px 3px 0 #000;margin-bottom:8px;text-align:center;letter-spacing:2px}
.subtitle{font-size:clamp(12px,2.5vw,20px);color:#ff0;margin-bottom:20px;text-align:center}
.btn{background:linear-gradient(135deg,#ff006e,#8338ec);color:#fff;border:none;padding:12px 32px;font-size:clamp(14px,2.5vw,20px);border-radius:12px;cursor:pointer;margin:6px;font-weight:700;text-transform:uppercase;letter-spacing:1px;box-shadow:0 4px 15px rgba(0,0,0,.4);transition:transform .1s}
.btn:hover{transform:scale(1.05)}.btn:active{transform:scale(.95)}
.char-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;max-width:650px;width:100%;margin:12px 0}
.char-card{background:rgba(255,255,255,.1);border:3px solid transparent;border-radius:12px;padding:10px;text-align:center;cursor:pointer;transition:all .2s}
.char-card:hover{background:rgba(255,255,255,.2)}
.char-card.sel{border-color:#0ff;background:rgba(0,255,255,.15)}
.char-name{color:#fff;font-weight:700;font-size:clamp(10px,1.8vw,13px)}
.char-stats{color:#aaa;font-size:clamp(9px,1.4vw,11px);margin-top:4px}
.sbar{height:5px;background:#333;border-radius:3px;margin:2px 0;overflow:hidden}
.sfill{height:100%;border-radius:3px}
.track-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;max-width:550px;width:100%;margin:12px 0}
.track-card{background:rgba(255,255,255,.1);border:3px solid transparent;border-radius:12px;padding:12px;text-align:center;cursor:pointer;transition:all .2s}
.track-card:hover{background:rgba(255,255,255,.2)}
.track-card.sel{border-color:#ff0;box-shadow:0 0 15px rgba(255,255,0,.3)}
.tname{color:#fff;font-weight:700;font-size:15px}.tdesc{color:#aaa;font-size:11px;margin-top:3px}
.diff-row{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap;justify-content:center}
.dbtn{padding:8px 18px;border-radius:8px;border:2px solid #555;background:transparent;color:#fff;cursor:pointer;font-weight:700;font-size:13px}
.dbtn.sel{border-color:#0f0;color:#0f0;box-shadow:0 0 10px rgba(0,255,0,.3)}
#hud{position:fixed;top:0;left:0;width:100%;pointer-events:none;padding:8px;display:none;z-index:12}
.hud-row{display:flex;justify-content:space-between;align-items:flex-start}
.hbox{background:rgba(0,0,0,.7);color:#fff;padding:5px 10px;border-radius:8px;font-size:clamp(11px,1.8vw,15px);font-weight:700}
.hbox.pos{font-size:clamp(16px,2.8vw,26px);color:#ff0}
#countdown{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:clamp(50px,12vw,100px);font-weight:900;color:#fff;text-shadow:0 0 30px #f0f,0 0 60px #0ff;display:none;pointer-events:none;z-index:15}
#touch-controls{position:fixed;bottom:0;left:0;width:100%;height:40%;pointer-events:none;display:none;z-index:11}
.tbtn{position:absolute;pointer-events:auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:rgba(255,255,255,.8);opacity:.35;-webkit-tap-highlight-color:transparent}
.tbtn:active,.tbtn.pressed{opacity:.6}
#tl{width:65px;height:65px;left:10px;bottom:70px;background:rgba(255,255,255,.15)}
#tr{width:65px;height:65px;left:85px;bottom:70px;background:rgba(255,255,255,.15)}
#tg{width:75px;height:75px;right:10px;bottom:70px;background:rgba(0,200,0,.2)}
#tb{width:65px;height:65px;right:95px;bottom:70px;background:rgba(200,0,0,.2)}
.rtable{width:100%;max-width:480px;margin:12px 0}
.rrow{display:flex;justify-content:space-between;padding:7px 14px;margin:3px 0;border-radius:8px;color:#fff;font-weight:700;font-size:clamp(12px,2.2vw,16px)}
.rrow.me{background:rgba(0,255,255,.2);border:1px solid #0ff}
.rrow.bot{background:rgba(255,255,255,.1)}
</style>
</head>
<body>
<canvas id="game" style="position:absolute;top:0;left:0"></canvas>
<div id="renderError" style="position:fixed;top:40px;left:50%;transform:translateX(-50%);background:red;color:#fff;padding:8px 16px;border-radius:8px;font-weight:700;font-size:14px;z-index:99;display:none"></div>
<div id="buildver" style="position:fixed;bottom:4px;left:4px;color:rgba(255,255,255,.5);font-size:10px;z-index:99;pointer-events:none">v8</div>
<div id="ui">
<div id="menu-screen" class="screen active">
<div class="title">BRAINROT RACING</div>
<div class="subtitle">Pseudo-3D Skibidi Kart Action</div>
<button class="btn" onclick="G.goCharSel()">START RACE</button>
</div>
<div id="char-screen" class="screen">
<div class="title" style="font-size:clamp(20px,3.5vw,36px)">CHOOSE RACER</div>
<div class="char-grid" id="cgrid"></div>
<button class="btn" onclick="G.goTrackSel()">NEXT</button>
</div>
<div id="track-screen" class="screen">
<div class="title" style="font-size:clamp(20px,3.5vw,36px)">CHOOSE TRACK</div>
<div class="track-grid" id="tgrid"></div>
<div class="subtitle" style="margin:8px 0 0;font-size:clamp(13px,2.2vw,18px)">DIFFICULTY</div>
<div class="diff-row" id="drow"></div>
<button class="btn" onclick="G.startRace()">RACE!</button>
</div>
<div id="results-screen" class="screen">
<div class="title" style="font-size:clamp(20px,3.5vw,36px)">RACE RESULTS</div>
<div class="rtable" id="rtable"></div>
<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
<button class="btn" onclick="G.goTrackSel()">RACE AGAIN</button>
<button class="btn" onclick="G.goMenu()">MENU</button>
</div>
</div>
</div>
<div id="hud"><div class="hud-row">
<div class="hbox pos" id="hpos">1st</div>
<div class="hbox" id="hlap">Lap 1/3</div>
<div class="hbox" id="htime">0:00.0</div>
</div></div>
<div id="countdown"></div>
<div id="touch-controls">
<div class="tbtn" id="tl">&#9664;</div>
<div class="tbtn" id="tr">&#9654;</div>
<div class="tbtn" id="tg">&#9650;</div>
<div class="tbtn" id="tb">&#9660;</div>
</div>
<script>
// ===== CANVAS SETUP =====
var C=document.getElementById('game'),X=C.getContext('2d');
var W=800,H=600;
var renderErr='';
function resize(){
W=window.innerWidth||800;H=window.innerHeight||600;
if(C.width!==W)C.width=W;if(C.height!==H)C.height=H;
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',resize);
C.addEventListener('contextlost',function(e){e.preventDefault();renderErr='Canvas context lost - click to restore';showRenderErr()});
C.addEventListener('contextrestored',function(){renderErr='';document.getElementById('renderError').style.display='none'});
function showRenderErr(){var el=document.getElementById('renderError');el.textContent=renderErr;el.style.display='block'}
resize();

// ===== AUDIO =====
var ACtx=window.AudioContext||window.webkitAudioContext,actx=null;
function initA(){if(!actx)try{actx=new ACtx()}catch(e){}}
function tone(f,d,t,v){if(!actx)return;try{var o=actx.createOscillator(),g=actx.createGain();o.type=t||'square';o.frequency.value=f;g.gain.setValueAtTime(v||.08,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}}
function sndEngine(sp){if(actx)tone(60+sp*4,.06,'sawtooth',.02)}
function sndCount(fin){tone(fin?880:440,.3,'sine',.12)}
function sndFinish(){tone(523,.15,'sine',.1);setTimeout(function(){tone(659,.15,'sine',.1)},150);setTimeout(function(){tone(784,.3,'sine',.1)},300)}

// ===== CHARACTERS =====
var CHARS=[
{name:'Tung Tung Sahur',abbr:'TT',color:'#ff3366',dark:'#aa1144',speed:7,accel:8,handling:6},
{name:'Tralalero Tralala',abbr:'TR',color:'#33ccff',dark:'#1188bb',speed:6,accel:7,handling:9},
{name:'Bombardiro Crocodilo',abbr:'BC',color:'#33ff66',dark:'#11aa33',speed:9,accel:5,handling:5},
{name:'Cappuccino Assassino',abbr:'CA',color:'#ff9933',dark:'#bb6611',speed:5,accel:9,handling:7},
{name:'Brr Brr Patapim',abbr:'BB',color:'#cc33ff',dark:'#8811bb',speed:8,accel:6,handling:8}
];

// ===== PSEUDO-3D CONSTANTS (OutRun-style projected segments) =====
var SEG_LEN=200;
var ROAD_W=2200;
var CAM_H=1500;
var FOV=100;
var CAM_DEPTH=1/Math.tan((FOV/2)*Math.PI/180);
var DRAW_DIST=220;
var RUMBLE_SEGS=4;
var CENTRIFUGAL=0.32;
var HILL_AMP=900;
var CURVE_MUL=5;

// ===== TRACKS =====
function buildTrack(spec){
var segs=[];var idx=0;
function easeInOut(a,b,p){return a+(b-a)*((-Math.cos(p*Math.PI)/2)+0.5)}
for(var i=0;i<spec.length;i++){
var s=spec[i];var len=s.len||1;var curve=s.curve||0;var hill=s.hill||0;
for(var j=0;j<len;j++){
var p=j/len,pn=(j+1)/len;
function ce(t){if(t<.25)return easeInOut(0,1,t/.25);if(t>.75)return easeInOut(1,0,(t-.75)/.25);return 1}
var y1=hill*HILL_AMP*Math.sin(Math.PI*p);
var y2=hill*HILL_AMP*Math.sin(Math.PI*pn);
segs.push({index:idx++,curve:curve*ce(p),p1y:y1,p2y:y2});
}
}
return segs;
}

var TRACKS=[
{name:'Skibidi Speedway',desc:'Fast oval with gentle bends',
skyTop:'#1a6fcc',skyBot:'#87ceeb',grassL:'#2d8c2d',grassD:'#246b24',roadL:'#6b6b6b',roadD:'#5e5e5e',rumbleL:'#ffffff',rumbleD:'#cc0000',lane:'#ffffff',treeCol:'#1e5a1e',treeTop:'#2f8c2f',
segs:buildTrack([
{len:80,curve:0},{len:100,curve:2.5},{len:40,curve:0},{len:50,curve:-1.8,hill:1.5},
{len:100,curve:2.5},{len:60,curve:0},{len:40,curve:-1.5,hill:-1.5},{len:50,curve:0},
{len:100,curve:2.5},{len:40,curve:0,hill:2},{len:100,curve:2.5},{len:60,curve:0,hill:-1.5}
])},
{name:'Rizz Circuit',desc:'Tight S-curves test your skill',
skyTop:'#0a0a2e',skyBot:'#3a2a5a',grassL:'#1f4a1f',grassD:'#14331a',roadL:'#4a4a4a',roadD:'#3e3e3e',rumbleL:'#ffff00',rumbleD:'#111111',lane:'#00ffff',treeCol:'#13361b',treeTop:'#1f5a2a',
segs:buildTrack([
{len:50,curve:0},{len:70,curve:4},{len:50,curve:-4},{len:70,curve:3.5,hill:2},
{len:50,curve:-3.5},{len:40,curve:0,hill:-1.5},{len:70,curve:-4},{len:50,curve:4},
{len:50,curve:0},{len:70,curve:-3.5,hill:1.5},{len:55,curve:3.5},{len:55,curve:0,hill:-2},
{len:50,curve:-4},{len:60,curve:4},{len:50,curve:0}
])},
{name:'Ohio Arena',desc:'Wild hills and sharp hairpins',
skyTop:'#cc3300',skyBot:'#ff9966',grassL:'#9b5523',grassD:'#7a4019',roadL:'#5a5a5a',roadD:'#4e4e4e',rumbleL:'#ff8800',rumbleD:'#884400',lane:'#ffdd00',treeCol:'#5a3010',treeTop:'#7a4a18',
segs:buildTrack([
{len:50,curve:0,hill:1},{len:55,curve:5,hill:3},{len:35,curve:0,hill:-2},{len:60,curve:-5},
{len:40,curve:0,hill:3},{len:55,curve:3.5},{len:55,curve:-3.5,hill:-3},{len:35,curve:0},
{len:60,curve:5},{len:40,curve:0,hill:2.5},{len:55,curve:-5,hill:-2},{len:40,curve:0},
{len:50,curve:3.5,hill:1.5},{len:60,curve:-3.5,hill:-1.5}
])}
];

function genScenery(track){
var sc=[];var n=track.segs.length;
for(var i=8;i<n;i+=3){
var side=(i%2===0)?-1:1;
var off=side*(1.6+Math.random()*1.4);
sc.push({idx:i%n,offset:off,h:1.5+Math.random()*1.2});
}
track.scenery=sc;
}
TRACKS.forEach(genScenery);

function findSeg(track,z){var n=track.segs.length;var i=Math.floor(z/SEG_LEN)%n;if(i<0)i+=n;return track.segs[i]}
function trackLen(track){return track.segs.length*SEG_LEN}

// ===== DIFFICULTY =====
var DIFFS={
Easy:{speedMul:.7,errRate:.03},
Medium:{speedMul:.88,errRate:.01},
Hard:{speedMul:1.0,errRate:.003}
};

// ===== INPUT =====
var keys={};
document.addEventListener('keydown',function(e){keys[e.key.toLowerCase()]=true;if(['arrowup','arrowdown','arrowleft','arrowright',' '].indexOf(e.key.toLowerCase())>=0)e.preventDefault()});
document.addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=false});
var touch={l:false,r:false,g:false,b:false};
function setupT(id,k){var el=document.getElementById(id);
el.addEventListener('touchstart',function(e){e.preventDefault();touch[k]=true;el.classList.add('pressed');initA()},{passive:false});
el.addEventListener('touchend',function(e){e.preventDefault();touch[k]=false;el.classList.remove('pressed')},{passive:false});
el.addEventListener('touchcancel',function(){touch[k]=false;el.classList.remove('pressed')})}
setupT('tl','l');setupT('tr','r');setupT('tg','g');setupT('tb','b');
function isMobile(){return 'ontouchstart' in window||navigator.maxTouchPoints>0}

// ===== HELPERS =====
function posStr(p){return p===1?'1st':p===2?'2nd':p===3?'3rd':p+'th'}
function fmtTime(t){var m=Math.floor(t/60000),s=Math.floor(t%60000/1000),ms=Math.floor(t%1000/100);return m+':'+String(s).padStart(2,'0')+'.'+ms}

// ===== RACER =====
function makeRacer(ch,isPlayer,slot){
var startOffsets=[0,-0.55,0.55,-0.25];
var laneBias=[0,-0.55,0.55,-0.25];
return{
ch:ch,isPlayer:isPlayer,
z:slot*SEG_LEN*5,
offset:startOffsets[slot]||0,
laneBias:laneBias[slot]||0,
speed:0,
maxSpd:3200+ch.speed*320,
accel:900+ch.accel*150,
handling:1.0+ch.handling*0.12,
lap:0,totalLaps:3,finished:false,finishTime:0,
position:slot+1,progress:0,
steerErr:0,errTimer:0,targetOff:0
};
}

// ===== GAME STATE =====
var G={
scr:'menu',selChar:0,selTrack:0,diff:'Medium',
racers:[],raceTime:0,started:false,finished:false,
cdVal:0,cdTimer:0,finishOrder:[],
cam:{x:0,y:0,z:0},engTimer:0,

show:function(id){
document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active')});
var el=document.getElementById(id);if(el)el.classList.add('active');
if(!id)document.getElementById('ui').style.display='none';
document.getElementById('hud').style.display='none';
document.getElementById('touch-controls').style.display='none';
document.getElementById('countdown').style.display='none';
},

goMenu:function(){this.scr='menu';document.getElementById('ui').style.display='flex';this.show('menu-screen')},

goCharSel:function(){
initA();this.scr='charSel';this.show('char-screen');
var g=document.getElementById('cgrid');g.innerHTML='';var self=this;
CHARS.forEach(function(c,i){
var d=document.createElement('div');d.className='char-card'+(i===self.selChar?' sel':'');
d.innerHTML='<div style="width:50px;height:50px;border-radius:50%;background:'+c.color+';margin:0 auto 6px;border:3px solid #fff;line-height:44px;text-align:center;font-weight:900;color:#fff;font-size:16px">'+c.abbr+'</div>'+
'<div class="char-name">'+c.name+'</div>'+
'<div class="char-stats">'+
'SPD '+c.speed+'/10<div class="sbar"><div class="sfill" style="width:'+c.speed*10+'%;background:#0f0"></div></div>'+
'ACC '+c.accel+'/10<div class="sbar"><div class="sfill" style="width:'+c.accel*10+'%;background:#ff0"></div></div>'+
'HND '+c.handling+'/10<div class="sbar"><div class="sfill" style="width:'+c.handling*10+'%;background:#0ff"></div></div></div>';
d.onclick=function(){self.selChar=i;g.querySelectorAll('.char-card').forEach(function(c2){c2.classList.remove('sel')});d.classList.add('sel');tone(440+i*80,.1,'sine',.08)};
g.appendChild(d);
});
},

goTrackSel:function(){
this.scr='trackSel';this.show('track-screen');
var tg=document.getElementById('tgrid');tg.innerHTML='';var self=this;
TRACKS.forEach(function(t,i){
var d=document.createElement('div');d.className='track-card'+(i===self.selTrack?' sel':'');
d.innerHTML='<div class="tname">'+t.name+'</div><div class="tdesc">'+t.desc+'</div>';
d.onclick=function(){self.selTrack=i;tg.querySelectorAll('.track-card').forEach(function(c){c.classList.remove('sel')});d.classList.add('sel');tone(330,.1,'sine',.08)};
tg.appendChild(d);
});
var dr=document.getElementById('drow');dr.innerHTML='';
['Easy','Medium','Hard'].forEach(function(d){
var b=document.createElement('button');b.className='dbtn'+(d===self.diff?' sel':'');b.textContent=d;
b.onclick=function(){self.diff=d;dr.querySelectorAll('.dbtn').forEach(function(x){x.classList.remove('sel')});b.classList.add('sel')};
dr.appendChild(b);
});
},

startRace:function(){
this.scr='race';this.show('');
document.getElementById('hud').style.display='block';
if(isMobile())document.getElementById('touch-controls').style.display='block';
var pc=CHARS[this.selChar];
this.raceTime=0;this.started=false;this.finished=false;
this.finishOrder=[];this.racers=[];
this.racers.push(makeRacer(pc,true,0));
var bots=CHARS.filter(function(_,i){return i!==G.selChar});
for(var i=0;i<3;i++)this.racers.push(makeRacer(bots[i],false,i+1));
this.cam={x:0,y:0,z:0};
this.cdVal=4;this.cdTimer=0;
document.getElementById('countdown').style.display='block';
document.getElementById('countdown').textContent='3';
sndCount(false);
},

showResults:function(){
this.scr='results';document.getElementById('ui').style.display='flex';this.show('results-screen');
document.getElementById('hud').style.display='none';
document.getElementById('touch-controls').style.display='none';
sndFinish();
var tb=document.getElementById('rtable');tb.innerHTML='';
var sorted=this.finishOrder.slice();var self=this;
this.racers.forEach(function(r){
if(!sorted.find(function(f){return f.name===r.ch.name}))
sorted.push({name:r.ch.name,abbr:r.ch.abbr,time:null,isPlayer:r.isPlayer});
});
sorted.forEach(function(r,i){
var row=document.createElement('div');row.className='rrow '+(r.isPlayer?'me':'bot');
var ts=r.time?fmtTime(r.time):'DNF';
row.innerHTML='<span>'+posStr(i+1)+'</span><span>'+r.abbr+' '+r.name+'</span><span>'+ts+'</span>';
tb.appendChild(row);
});
}
};

// ===== PSEUDO-3D RENDERER =====
function project(wy,wz,camX,camZ){
var dz=wz-camZ;if(dz<1)dz=1;
var scale=CAM_DEPTH/dz;
return{
scale:scale,
x:Math.round(W/2 + scale*(0-camX)*(W/2)),
y:Math.round(H/2 - scale*(wy-CAM_H)*(H/2)),
w:Math.round(scale*ROAD_W*(W/2)),
dz:dz
};
}

var segProj=[];

function renderRoad(track,position,playerX){
var segs=track.segs;var N=segs.length;var TL=N*SEG_LEN;
var base=Math.floor(position/SEG_LEN)%N;if(base<0)base+=N;
var basePercent=(position%SEG_LEN)/SEG_LEN;

var horizon=Math.round(H*0.45);
var sky=X.createLinearGradient(0,0,0,horizon);
sky.addColorStop(0,track.skyTop);sky.addColorStop(1,track.skyBot);
X.fillStyle=sky;X.fillRect(0,0,W,horizon);
X.fillStyle=track.grassD;X.fillRect(0,horizon,W,H-horizon);

var x=0;
var dx=-(segs[base].curve*basePercent)*CURVE_MUL;
var maxy=H;

for(var n=0;n<DRAW_DIST;n++){
var i=(base+n)%N;var seg=segs[i];
var looped=(base+n)>=N;
var camZ=position-(looped?TL:0);
var camX1=playerX*ROAD_W - x;
var camX2=playerX*ROAD_W - x - dx;
var p1=project(seg.p1y,seg.index*SEG_LEN,camX1,camZ);
var p2=project(seg.p2y,(seg.index+1)*SEG_LEN,camX2,camZ);
segProj[n]={x:p1.x,y:p1.y,scale:p1.scale,w:p1.w,drawn:false};
x+=dx;dx+=seg.curve*CURVE_MUL;

if(p1.dz<=CAM_DEPTH||p2.y>=maxy||p2.y>=p1.y){continue}
maxy=p2.y;
segProj[n].drawn=true;

var light=Math.floor(seg.index/RUMBLE_SEGS)%2===0;
var grass=light?track.grassL:track.grassD;
var road=light?track.roadL:track.roadD;
var rumble=light?track.rumbleL:track.rumbleD;

X.fillStyle=grass;X.fillRect(0,p2.y,W,p1.y-p2.y);
var r1=p1.w*1.18,r2=p2.w*1.18;
poly(p1.x-r1,p1.y,p1.x+r1,p1.y,p2.x+r2,p2.y,p2.x-r2,p2.y,rumble);
poly(p1.x-p1.w,p1.y,p1.x+p1.w,p1.y,p2.x+p2.w,p2.y,p2.x-p2.w,p2.y,road);
if(light){
var lw1=p1.w*0.04,lw2=p2.w*0.04;
poly(p1.x-lw1,p1.y,p1.x+lw1,p1.y,p2.x+lw2,p2.y,p2.x-lw2,p2.y,track.lane);
var o1=p1.w*0.5,o2=p2.w*0.5;
poly(p1.x-o1-lw1,p1.y,p1.x-o1+lw1,p1.y,p2.x-o2+lw2,p2.y,p2.x-o2-lw2,p2.y,'rgba(255,255,255,.35)');
poly(p1.x+o1-lw1,p1.y,p1.x+o1+lw1,p1.y,p2.x+o2+lw2,p2.y,p2.x+o2-lw2,p2.y,'rgba(255,255,255,.35)');
}
if(seg.index===0){
poly(p1.x-p1.w,p1.y,p1.x+p1.w,p1.y,p2.x+p2.w,p2.y,p2.x-p2.w,p2.y,'#ffffff');
}
}
}

function poly(x1,y1,x2,y2,x3,y3,x4,y4,col){
X.fillStyle=col;X.beginPath();
X.moveTo(x1,y1);X.lineTo(x2,y2);X.lineTo(x3,y3);X.lineTo(x4,y4);
X.closePath();X.fill();
}

// ===== SPRITES =====
function drawCarSprite(cx,cyBottom,w,col,dark,abbr){
if(w<3)return;
var h=w*1.25;
var top=cyBottom-h;
X.fillStyle='rgba(0,0,0,.35)';
X.beginPath();X.ellipse(cx,cyBottom,w*0.6,w*0.16,0,0,Math.PI*2);X.fill();
X.fillStyle=col;X.fillRect(cx-w/2,top,w,h);
X.fillStyle=dark;X.fillRect(cx-w/2,cyBottom-h*0.28,w,h*0.28);
X.fillStyle='rgba(180,210,255,.55)';X.fillRect(cx-w*0.34,top+h*0.12,w*0.68,h*0.22);
X.fillStyle='#111';
X.fillRect(cx-w/2-w*0.1,top+h*0.5,w*0.14,h*0.4);
X.fillRect(cx+w/2-w*0.04,top+h*0.5,w*0.14,h*0.4);
X.strokeStyle='rgba(0,0,0,.6)';X.lineWidth=Math.max(1,w*0.03);X.strokeRect(cx-w/2,top,w,h);
if(w>26){X.fillStyle='#fff';X.font='bold '+Math.round(w*0.32)+'px sans-serif';X.textAlign='center';X.fillText(abbr,cx,top-3)}
}

function drawTree(cx,cyBottom,w,track){
if(w<3)return;
var h=w*2.2;
X.fillStyle='rgba(0,0,0,.3)';X.beginPath();X.ellipse(cx,cyBottom,w*0.5,w*0.14,0,0,Math.PI*2);X.fill();
X.fillStyle='#5a3a1a';X.fillRect(cx-w*0.12,cyBottom-h*0.4,w*0.24,h*0.4);
X.fillStyle=track.treeCol;X.beginPath();X.arc(cx,cyBottom-h*0.55,w*0.7,0,Math.PI*2);X.fill();
X.fillStyle=track.treeTop;X.beginPath();X.arc(cx-w*0.2,cyBottom-h*0.65,w*0.45,0,Math.PI*2);X.fill();
}

function renderSprites(track,racers,playerIdx){
var N=track.segs.length;var TL=N*SEG_LEN;
var player=racers[playerIdx];
var base=Math.floor(player.z/SEG_LEN)%N;if(base<0)base+=N;

var list=[];
function addSprite(absZ,offset,kind,data){
var segIdx=Math.floor(absZ/SEG_LEN)%N;if(segIdx<0)segIdx+=N;
var n=(segIdx-base+N)%N;
if(n>0&&n<DRAW_DIST&&segProj[n])list.push({n:n,offset:offset,kind:kind,data:data});
}
for(var i=0;i<racers.length;i++){if(i===playerIdx)continue;addSprite(racers[i].z,racers[i].offset,'car',racers[i])}
if(track.scenery)for(var i=0;i<track.scenery.length;i++){var s=track.scenery[i];addSprite(s.idx*SEG_LEN,s.offset,'tree',s)}

list.sort(function(a,b){return b.n-a.n});
for(var i=0;i<list.length;i++){
var sp=list[i];var pr=segProj[sp.n];
// skip sprites on segments hidden behind hills (prevents floating trees)
if(!pr.drawn)continue;
var sx=pr.x+pr.scale*(sp.offset*ROAD_W)*(W/2);
// size scales with perspective; clamp so nothing becomes giant or vanishes
var base=pr.scale*ROAD_W*(W/2);
if(sp.kind==='car'){
var cw=Math.max(8,Math.min(W*0.13, base*0.55));
drawCarSprite(sx,pr.y,cw,sp.data.ch.color,sp.data.ch.dark,sp.data.ch.abbr);
}else{
var tw=Math.max(5,Math.min(W*0.09, base*0.42*sp.data.h));
drawTree(sx,pr.y,tw,track);
}
}

var pcw=W*0.10;
var lean=(player._lean||0);
drawCarSprite(W/2+lean*W*0.04,H*0.93,pcw,player.ch.color,player.ch.dark,player.ch.abbr);
}

// ===== MINIMAP =====
function renderMinimap(track,racers){
var mmS=120,mx=W-mmS-12,my=H-mmS-12;
X.fillStyle='rgba(0,0,0,.6)';X.fillRect(mx,my,mmS,mmS);
X.strokeStyle='rgba(255,255,255,.4)';X.lineWidth=1;X.strokeRect(mx,my,mmS,mmS);
var segs=track.segs,n=segs.length;
if(!track._mm){
var ang=0,px=0,py=0,pts=[];
for(var i=0;i<n;i++){ang+=segs[i].curve*0.025;px+=Math.cos(ang);py+=Math.sin(ang);pts.push({x:px,y:py})}
var mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9;
for(var i=0;i<pts.length;i++){if(pts[i].x<mnx)mnx=pts[i].x;if(pts[i].x>mxx)mxx=pts[i].x;if(pts[i].y<mny)mny=pts[i].y;if(pts[i].y>mxy)mxy=pts[i].y}
track._mm={pts:pts,mnx:mnx,mxx:mxx,mny:mny,mxy:mxy};
}
var mm=track._mm;var rx=mm.mxx-mm.mnx||1,ry=mm.mxy-mm.mny||1;
var sc=Math.min((mmS-18)/rx,(mmS-18)/ry);
var ox=mx+(mmS-rx*sc)/2-mm.mnx*sc,oy=my+(mmS-ry*sc)/2-mm.mny*sc;
X.strokeStyle='#888';X.lineWidth=2;X.beginPath();
for(var i=0;i<mm.pts.length;i++){var X2=ox+mm.pts[i].x*sc,Y2=oy+mm.pts[i].y*sc;i===0?X.moveTo(X2,Y2):X.lineTo(X2,Y2)}
X.closePath();X.stroke();
for(var i=0;i<racers.length;i++){
var r=racers[i];var fz=r.z/SEG_LEN;var idx=Math.floor(fz)%n;if(idx<0)idx+=n;var fr=fz-Math.floor(fz);var idx2=(idx+1)%n;
var dxp=ox+(mm.pts[idx].x+(mm.pts[idx2].x-mm.pts[idx].x)*fr)*sc;
var dyp=oy+(mm.pts[idx].y+(mm.pts[idx2].y-mm.pts[idx].y)*fr)*sc;
X.fillStyle=r.ch.color;X.beginPath();X.arc(dxp,dyp,r.isPlayer?4:3,0,Math.PI*2);X.fill();
if(r.isPlayer){X.strokeStyle='#fff';X.lineWidth=1.5;X.stroke()}
}
}

// ===== UPDATE LOGIC =====
function updatePlayer(r,track,dt){
var dtS=dt/1000;var N=track.segs.length;var TL=N*SEG_LEN;
if(r.finished){r.speed*=0.96;r.z+=r.speed*dtS;if(r.z>=TL)r.z-=TL;return}
var gas=keys['arrowup']||keys['w']||touch.g;
var brake=keys['arrowdown']||keys['s']||touch.b;
var left=keys['arrowleft']||keys['a']||touch.l;
var right=keys['arrowright']||keys['d']||touch.r;

if(gas)r.speed+=r.accel*dtS;
else if(brake)r.speed-=r.accel*1.6*dtS;
else r.speed-=r.speed*0.7*dtS;
if(r.speed>r.maxSpd)r.speed=r.maxSpd;if(r.speed<0)r.speed=0;

var spdPct=r.speed/r.maxSpd;
var steer=dtS*2.6*r.handling*(0.35+spdPct*0.65);
var lean=0;
if(left){r.offset-=steer;lean=-1}
if(right){r.offset+=steer;lean=1}
r._lean=(r._lean||0)+((lean)-(r._lean||0))*0.2;

var seg=findSeg(track,r.z);
r.offset-=dtS*spdPct*spdPct*seg.curve*CENTRIFUGAL;

if(Math.abs(r.offset)>1){r.speed-=r.speed*1.2*dtS;if(r.speed<r.maxSpd*0.35)r.speed=r.maxSpd*0.35}
if(r.offset>2)r.offset=2;if(r.offset<-2)r.offset=-2;

// collision with bots: bump apart and lose speed instead of passing through
for(var ci=0;ci<G.racers.length;ci++){
var o=G.racers[ci];if(o===r)continue;
var dzc=o.z-r.z;
if(dzc>TL/2)dzc-=TL;if(dzc<-TL/2)dzc+=TL;
if(Math.abs(dzc)<SEG_LEN*1.3&&Math.abs(o.offset-r.offset)<0.45){
r.offset+=(r.offset<o.offset?-1:1)*1.5*dtS;
if(r.speed>o.speed){r.speed=o.speed*0.85}
}
}

r.z+=r.speed*dtS;
if(r.z>=TL){r.z-=TL;r.lap++;
if(r.lap>=r.totalLaps&&!r.finished){
r.finished=true;r.finishTime=G.raceTime;
G.finishOrder.push({name:r.ch.name,abbr:r.ch.abbr,time:r.finishTime,isPlayer:true});
}}
}

function updateBot(r,track,dt){
var dtS=dt/1000;var N=track.segs.length;var TL=N*SEG_LEN;
if(r.finished){r.speed*=0.96;r.z+=r.speed*dtS;if(r.z>=TL)r.z-=TL;return}
var diff=DIFFS[G.diff];
var seg=findSeg(track,r.z);
r.errTimer-=dt;
if(r.errTimer<=0){r.targetOff=r.laneBias+(Math.random()-0.5)*diff.errRate*40;r.errTimer=700+Math.random()*1100}
r.offset+=(r.targetOff-r.offset)*dtS*1.8;
var spdPct=r.speed/r.maxSpd;
r.offset-=dtS*spdPct*spdPct*seg.curve*CENTRIFUGAL*0.8;
if(r.offset>1.6)r.offset=1.6;if(r.offset<-1.6)r.offset=-1.6;
var target=r.maxSpd*diff.speedMul*Math.max(0.55,1-Math.abs(seg.curve)*0.06);
if(r.speed<target)r.speed+=r.accel*dtS;else r.speed+=(target-r.speed)*dtS*4;
if(r.speed<r.maxSpd*0.3)r.speed=r.maxSpd*0.3;
r.z+=r.speed*dtS;
if(r.z>=TL){r.z-=TL;r.lap++;
if(r.lap>=r.totalLaps&&!r.finished){
r.finished=true;r.finishTime=G.raceTime;
G.finishOrder.push({name:r.ch.name,abbr:r.ch.abbr,time:r.finishTime,isPlayer:false});
}}
}

function calcPositions(racers,track){
var TL=track.segs.length*SEG_LEN;
racers.forEach(function(r){r.progress=r.lap*TL+r.z});
var sorted=racers.slice().sort(function(a,b){
if(a.finished&&b.finished)return a.finishTime-b.finishTime;
if(a.finished)return-1;if(b.finished)return 1;
return b.progress-a.progress;
});
sorted.forEach(function(r,i){r.position=i+1});
}

// ===== MAIN LOOP =====
var lastTime=0;
function loop(time){
var dt=Math.min(time-lastTime,50);lastTime=time;

if(G.scr==='race'){
resize();
var track=TRACKS[G.selTrack];

if(G.cdVal>0){
G.cdTimer+=dt;
if(G.cdTimer>=1000){
G.cdTimer=0;G.cdVal--;
var cd=document.getElementById('countdown');
if(G.cdVal>0){cd.textContent=G.cdVal;sndCount(false)}
else{cd.textContent='GO!';sndCount(true);G.started=true;setTimeout(function(){cd.style.display='none'},500)}
}
}

if(G.started&&!G.finished){
G.raceTime+=dt;
G.engTimer+=dt;
var player=G.racers[0];
updatePlayer(player,track,dt);
for(var i=1;i<G.racers.length;i++)updateBot(G.racers[i],track,dt);
calcPositions(G.racers,track);
if(G.engTimer>80){G.engTimer=0;sndEngine(player.speed)}
if(!G.finished&&G.racers[0].finished){
G.finished=true;setTimeout(function(){G.showResults()},2000);
}
}

try{
X.setTransform(1,0,0,1,0,0);
var player=G.racers[0];
renderRoad(track,player.z,player.offset);
renderSprites(track,G.racers,0);
renderMinimap(track,G.racers);
}catch(err){
if(!renderErr){renderErr='Render error: '+err.message;showRenderErr()}
X.fillStyle='#226';X.fillRect(0,0,W,H);
X.fillStyle='#fff';X.font='20px sans-serif';X.textAlign='center';
X.fillText('Render error: '+err.message,W/2,H/2);
X.fillText('W='+W+' H='+H+' z='+(G.racers[0]?Math.round(G.racers[0].z):'?'),W/2,H/2+30);
}

document.getElementById('hpos').textContent=posStr((G.racers[0]&&G.racers[0].position)||1);
document.getElementById('hlap').textContent='Lap '+Math.min((G.racers[0]?G.racers[0].lap:0)+1,3)+'/3';
document.getElementById('htime').textContent=fmtTime(G.raceTime);
}

requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
