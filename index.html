<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>BRAINROT RACING</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Segoe UI',sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#ui{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;display:flex;align-items:center;justify-content:center;z-index:10}
#ui>div{pointer-events:auto}
.screen{display:none;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;padding:20px;overflow-y:auto}
.screen.active{display:flex}
.title{font-family:'Arial Black','Impact',sans-serif;font-size:clamp(24px,5vw,56px);font-weight:900;color:#fff;text-shadow:0 0 20px #f0f,0 0 40px #0ff,3px 3px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000;margin-bottom:8px;text-align:center;letter-spacing:2px}
.subtitle{font-size:clamp(12px,2.5vw,20px);color:#ff0;margin-bottom:20px;text-align:center}
.btn{background:linear-gradient(135deg,#ff006e,#8338ec);color:#fff;border:none;padding:12px 32px;font-size:clamp(14px,2.5vw,20px);border-radius:12px;cursor:pointer;margin:6px;font-weight:700;text-transform:uppercase;letter-spacing:1px;box-shadow:0 4px 15px rgba(0,0,0,.4);transition:transform .1s}
.btn:hover{transform:scale(1.05)}.btn:active{transform:scale(.95)}
.char-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;max-width:650px;width:100%;margin:12px 0}
.char-card{background:rgba(255,255,255,.1);border:3px solid transparent;border-radius:12px;padding:10px;text-align:center;cursor:pointer;transition:all .2s}
.char-card:hover{background:rgba(255,255,255,.2)}
.char-card.sel{border-color:#0ff;background:rgba(0,255,255,.15)}
.char-name{color:#fff;font-weight:700;font-size:clamp(10px,1.8vw,13px)}
.char-stats{color:#aaa;font-size:clamp(9px,1.4vw,11px);margin-top:4px}
.sbar{height:5px;background:#333;border-radius:3px;margin:2px 0;overflow:hidden}
.sfill{height:100%;border-radius:3px}
.track-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;max-width:550px;width:100%;margin:12px 0}
.track-card{background:rgba(255,255,255,.1);border:3px solid transparent;border-radius:12px;padding:12px;text-align:center;cursor:pointer;transition:all .2s}
.track-card:hover{background:rgba(255,255,255,.2)}
.track-card.sel{border-color:#ff0;box-shadow:0 0 15px rgba(255,255,0,.3)}
.tname{color:#fff;font-weight:700;font-size:15px}.tdesc{color:#aaa;font-size:11px;margin-top:3px}
.diff-row{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap;justify-content:center}
.dbtn{padding:8px 18px;border-radius:8px;border:2px solid #555;background:transparent;color:#fff;cursor:pointer;font-weight:700;font-size:13px}
.dbtn.sel{border-color:#0f0;color:#0f0;box-shadow:0 0 10px rgba(0,255,0,.3)}
#hud{position:fixed;top:0;left:0;width:100%;pointer-events:none;padding:8px;display:none;z-index:12}
.hud-row{display:flex;justify-content:space-between;align-items:flex-start}
.hbox{background:rgba(0,0,0,.7);color:#fff;padding:5px 12px;border-radius:8px;font-family:'Arial Black','Impact',sans-serif;font-size:clamp(12px,1.9vw,16px);font-weight:900;letter-spacing:.5px;text-shadow:2px 2px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;transition:transform .12s ease-out}
.hbox.pos{font-size:clamp(18px,3vw,28px);color:#ff0;text-shadow:2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000}
#hlap.lappop{animation:lapPop .42s ease-out;color:#0ff}
@keyframes lapPop{0%{transform:scale(1)}30%{transform:scale(1.5);color:#0ff}60%{transform:scale(.92)}100%{transform:scale(1)}}
#hpos.posup{animation:posUp .45s ease-out}
#hpos.posdown{animation:posDown .45s ease-out}
@keyframes posUp{0%{transform:scale(1) translateX(0);color:#ff0}15%{transform:scale(1.45) translateX(-4px);color:#0f0}30%{transform:scale(1.4) translateX(4px);color:#0f0}45%{transform:scale(1.3) translateX(-3px)}60%{transform:scale(1.15) translateX(3px);color:#0f0}100%{transform:scale(1) translateX(0);color:#ff0}}
@keyframes posDown{0%{transform:scale(1) translateX(0);color:#ff0}15%{transform:scale(1.25) translateX(-5px);color:#f33}30%{transform:scale(1.2) translateX(5px);color:#f33}45%{transform:scale(1.1) translateX(-4px)}60%{transform:scale(1.05) translateX(4px);color:#f33}100%{transform:scale(1) translateX(0);color:#ff0}}
#muteBtn{position:fixed;top:46px;right:8px;width:42px;height:42px;border-radius:10px;border:2px solid rgba(255,255,255,.35);background:rgba(0,0,0,.6);color:#fff;font-size:20px;cursor:pointer;display:none;z-index:13;line-height:1;padding:0;-webkit-tap-highlight-color:transparent}
#muteBtn:active{transform:scale(.92)}
#tauntBtn{position:fixed;top:94px;right:8px;width:42px;height:42px;border-radius:10px;border:2px solid rgba(255,225,77,.5);background:rgba(0,0,0,.6);color:#fff;font-size:20px;cursor:pointer;display:none;z-index:13;line-height:1;padding:0;-webkit-tap-highlight-color:transparent}
#tauntBtn:active{transform:scale(.92)}
#countdown{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Arial Black','Impact',sans-serif;font-size:clamp(50px,12vw,100px);font-weight:900;color:#fff;text-shadow:0 0 30px #f0f,0 0 60px #0ff,4px 4px 0 #000,-3px -3px 0 #000,3px -3px 0 #000,-3px 3px 0 #000,3px 3px 0 #000;display:none;pointer-events:none;z-index:15}
#countdown.cdpop{animation:cdPop .55s ease-out}
@keyframes cdPop{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}25%{transform:translate(-50%,-50%) scale(1.4);opacity:1}45%{transform:translate(-50%,-50%) scale(.95)}60%{transform:translate(-50%,-50%) scale(1.08)}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
#touch-controls{position:fixed;bottom:0;left:0;width:100%;height:46%;pointer-events:none;display:none;z-index:11}
.tbtn{position:absolute;pointer-events:auto;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;font-family:'Arial Black','Impact',sans-serif;font-size:28px;font-weight:900;color:rgba(255,255,255,.85);opacity:.4;-webkit-tap-highlight-color:transparent;text-shadow:1px 1px 0 #000}
.tbtn .tlbl{font-size:11px;margin-top:2px;letter-spacing:.5px}
.tbtn:active,.tbtn.pressed{opacity:.7;transform:scale(.93)}
#tl{width:74px;height:74px;left:12px;bottom:84px;background:rgba(255,255,255,.18)}
#tr{width:74px;height:74px;left:96px;bottom:84px;background:rgba(255,255,255,.18)}
#tg{width:84px;height:84px;right:12px;bottom:84px;background:rgba(0,200,0,.25)}
#tb{width:74px;height:74px;right:104px;bottom:84px;background:rgba(200,0,0,.25)}
#td{width:74px;height:74px;left:54px;bottom:168px;background:rgba(120,80,255,.28)}
#tboost{width:78px;height:78px;right:54px;bottom:170px;background:rgba(255,170,0,.3)}
.rtable{width:100%;max-width:480px;margin:12px 0}
.rrow{display:flex;justify-content:space-between;padding:7px 14px;margin:3px 0;border-radius:8px;color:#fff;font-weight:700;font-size:clamp(12px,2.2vw,16px)}
.rrow.me{background:rgba(0,255,255,.2);border:1px solid #0ff}
.rrow.bot{background:rgba(255,255,255,.1)}
.rrow.me.win{background:rgba(255,215,0,.28);border:2px solid #ffd700;animation:meGlow 1s ease-in-out infinite alternate}
.rrow.me:not(.win){animation:meGlow2 1.2s ease-in-out infinite alternate}
@keyframes meGlow{from{box-shadow:0 0 6px rgba(255,215,0,.5)}to{box-shadow:0 0 22px rgba(255,215,0,.95)}}
@keyframes meGlow2{from{box-shadow:0 0 4px rgba(0,255,255,.4)}to{box-shadow:0 0 16px rgba(0,255,255,.8)}}
#winhdr{font-family:'Arial Black','Impact',sans-serif;font-weight:900;text-align:center;margin-bottom:6px;letter-spacing:1px;font-size:clamp(22px,4.5vw,44px);color:#ffd700;text-shadow:0 0 20px #ff0,0 0 40px #f80,3px 3px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000;animation:hdrPop .6s ease-out}
@keyframes hdrPop{0%{transform:scale(.3);opacity:0}55%{transform:scale(1.25);opacity:1}100%{transform:scale(1)}}
</style>
</head>
<body>
<canvas id="game" style="position:absolute;top:0;left:0"></canvas>
<div id="renderError" style="position:fixed;top:40px;left:50%;transform:translateX(-50%);background:red;color:#fff;padding:8px 16px;border-radius:8px;font-weight:700;font-size:14px;z-index:99;display:none"></div>
<div id="buildver" style="position:fixed;bottom:4px;left:4px;color:rgba(255,255,255,.5);font-size:10px;z-index:99;pointer-events:none">v12</div>
<div id="ui">
<div id="menu-screen" class="screen active">
<div class="title">BRAINROT RACING</div>
<div class="subtitle">Pseudo-3D Skibidi Kart Action</div>
<button class="btn" onclick="G.goCharSel()">START RACE</button>
</div>
<div id="char-screen" class="screen">
<div class="title" style="font-size:clamp(20px,3.5vw,36px)">CHOOSE RACER</div>
<div class="char-grid" id="cgrid"></div>
<button class="btn" onclick="G.goTrackSel()">NEXT</button>
</div>
<div id="track-screen" class="screen">
<div class="title" style="font-size:clamp(20px,3.5vw,36px)">CHOOSE TRACK</div>
<div class="track-grid" id="tgrid"></div>
<div class="subtitle" style="margin:8px 0 0;font-size:clamp(13px,2.2vw,18px)">DIFFICULTY</div>
<div class="diff-row" id="drow"></div>
<button class="btn" onclick="G.startRace()">RACE!</button>
</div>
<div id="results-screen" class="screen">
<div id="winhdr"></div>
<div class="title" style="font-size:clamp(20px,3.5vw,36px)">RACE RESULTS</div>
<div class="rtable" id="rtable"></div>
<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
<button class="btn" onclick="G.goTrackSel()">RACE AGAIN</button>
<button class="btn" onclick="G.goMenu()">MENU</button>
</div>
</div>
</div>
<div id="hud"><div class="hud-row">
<div class="hbox pos" id="hpos">1st</div>
<div class="hbox" id="hlap">Lap 1/3</div>
<div class="hbox" id="htime">0:00.0</div>
</div></div>
<button id="muteBtn" title="Mute / Unmute" onclick="initA();toggleMute()">&#128266;</button>
<button id="tauntBtn" title="Taunt (T)" onclick="doTaunt()" ontouchstart="event.preventDefault();doTaunt()">&#129313;</button>
<div id="countdown"></div>
<div id="touch-controls">
<div class="tbtn" id="tl">&#9664;</div>
<div class="tbtn" id="tr">&#9654;</div>
<div class="tbtn" id="tg">&#9650;<span class="tlbl">GAS</span></div>
<div class="tbtn" id="tb">&#9660;<span class="tlbl">BRAKE</span></div>
<div class="tbtn" id="td">&#10227;<span class="tlbl">DRIFT</span></div>
<div class="tbtn" id="tboost">&#128293;<span class="tlbl">BOOST</span></div>
</div>
<script>
// ===== CANVAS SETUP =====
var C=document.getElementById('game'),X=C.getContext('2d');
var W=800,H=600;
var renderErr='';
function resize(){
W=window.innerWidth||800;H=window.innerHeight||600;
if(C.width!==W)C.width=W;if(C.height!==H)C.height=H;
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',resize);
C.addEventListener('contextlost',function(e){e.preventDefault();renderErr='Canvas context lost - click to restore';showRenderErr()});
C.addEventListener('contextrestored',function(){renderErr='';document.getElementById('renderError').style.display='none'});
function showRenderErr(){var el=document.getElementById('renderError');el.textContent=renderErr;el.style.display='block'}
resize();

// ===== AUDIO =====
var ACtx=window.AudioContext||window.webkitAudioContext,actx=null;
var masterGain=null,sfxGain=null,musicGain=null;// master -> destination; sfx & music feed master
var engineOsc=null,engineGain=null,engineFilter=null;// persistent engine rumble nodes
function initA(){
if(actx)return;
try{
actx=new ACtx();
masterGain=actx.createGain();masterGain.gain.value=G.muted?0:1;masterGain.connect(actx.destination);
sfxGain=actx.createGain();sfxGain.gain.value=0.9;sfxGain.connect(masterGain);
musicGain=actx.createGain();musicGain.gain.value=0.0;musicGain.connect(masterGain);// faded in when music starts
}catch(e){actx=null}
}
// SFX tone routed through sfxGain so the master mute silences it
function tone(f,d,t,v){if(!actx)return;try{var o=actx.createOscillator(),g=actx.createGain();o.type=t||'square';o.frequency.value=f;g.gain.setValueAtTime(v||.08,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g);g.connect(sfxGain||actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}}

// --- persistent engine rumble: one oscillator whose pitch/volume track speed ---
function startEngine(){
if(!actx||engineOsc)return;
try{
engineOsc=actx.createOscillator();engineGain=actx.createGain();engineFilter=actx.createBiquadFilter();
engineOsc.type='sawtooth';engineOsc.frequency.value=55;
engineFilter.type='lowpass';engineFilter.frequency.value=400;
engineGain.gain.value=0.0;
engineOsc.connect(engineFilter);engineFilter.connect(engineGain);engineGain.connect(sfxGain||actx.destination);
engineOsc.start();
}catch(e){engineOsc=null}
}
function stopEngine(){
if(!actx||!engineOsc)return;
try{engineGain.gain.setTargetAtTime(0,actx.currentTime,0.05);var o=engineOsc;setTimeout(function(){try{o.stop()}catch(e){}},120)}catch(e){}
engineOsc=null;engineGain=null;engineFilter=null;
}
// sndEngine(sp): sp is current speed (0..maxSpd~6000). Pitch & brightness clearly rise with speed.
function sndEngine(sp){
if(!actx)return;
if(!engineOsc)startEngine();
if(!engineOsc)return;
try{
var pct=sp/6000;if(pct<0)pct=0;if(pct>1.2)pct=1.2;
var freq=50+pct*230;// idle ~50Hz up to ~330Hz at top speed
var t=actx.currentTime;
engineOsc.frequency.setTargetAtTime(freq,t,0.04);
engineFilter.frequency.setTargetAtTime(350+pct*1400,t,0.05);
engineGain.gain.setTargetAtTime(0.016+pct*0.05,t,0.05);// subtle, louder with speed
}catch(e){}
}
function sndCount(fin){tone(fin?880:440,.3,'sine',.12)}
function sndFinish(){tone(523,.16,'square',.1);setTimeout(function(){tone(659,.16,'square',.1)},150);setTimeout(function(){tone(784,.16,'square',.1)},300);setTimeout(function(){tone(1047,.4,'square',.11)},460)}
function sndWin(){sndFinish()}
function sndBoost(){if(!actx)return;try{var o=actx.createOscillator(),g=actx.createGain();o.type='sawtooth';o.frequency.setValueAtTime(160,actx.currentTime);o.frequency.exponentialRampToValueAtTime(1100,actx.currentTime+0.45);g.gain.setValueAtTime(.0001,actx.currentTime);g.gain.exponentialRampToValueAtTime(.13,actx.currentTime+0.12);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+0.55);o.connect(g);g.connect(sfxGain||actx.destination);o.start();o.stop(actx.currentTime+0.55);
// airy noise layer for "whoosh"
var nb=actx.createBuffer(1,actx.sampleRate*0.4,actx.sampleRate),nd=nb.getChannelData(0);for(var i=0;i<nd.length;i++)nd[i]=(Math.random()*2-1)*(1-i/nd.length);var ns=actx.createBufferSource();ns.buffer=nb;var nf=actx.createBiquadFilter();nf.type='highpass';nf.frequency.value=900;var ng=actx.createGain();ng.gain.setValueAtTime(.06,actx.currentTime);ng.gain.exponentialRampToValueAtTime(.001,actx.currentTime+0.4);ns.connect(nf);nf.connect(ng);ng.connect(sfxGain||actx.destination);ns.start();ns.stop(actx.currentTime+0.4);
}catch(e){}}
function sndHit(){tone(90,.2,'square',.12)}
// comedic descending "bonk" for crashes
function sndCrash(){if(!actx)return;try{var o=actx.createOscillator(),g=actx.createGain();o.type='square';o.frequency.setValueAtTime(380,actx.currentTime);o.frequency.exponentialRampToValueAtTime(70,actx.currentTime+0.22);g.gain.setValueAtTime(.14,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+0.28);o.connect(g);g.connect(sfxGain||actx.destination);o.start();o.stop(actx.currentTime+0.28)}catch(e){}}
// cheerful ascending blip arpeggio for item pickup
function sndPickup(){tone(880,.08,'square',.09);setTimeout(function(){tone(1175,.08,'square',.09)},70);setTimeout(function(){tone(1568,.1,'square',.09)},140)}
// goofy taunt: quick wobble/"wah-wah"
function sndTaunt(){if(!actx)return;try{var o=actx.createOscillator(),g=actx.createGain();o.type='sawtooth';o.frequency.setValueAtTime(500,actx.currentTime);o.frequency.linearRampToValueAtTime(300,actx.currentTime+0.12);o.frequency.linearRampToValueAtTime(440,actx.currentTime+0.24);o.frequency.linearRampToValueAtTime(220,actx.currentTime+0.4);g.gain.setValueAtTime(.1,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+0.45);o.connect(g);g.connect(sfxGain||actx.destination);o.start();o.stop(actx.currentTime+0.45)}catch(e){}}
// drift tire squeal: high noisy-ish square, short
function sndDrift(){if(!actx)return;try{var o=actx.createOscillator(),g=actx.createGain();o.type='sawtooth';o.frequency.setValueAtTime(1600,actx.currentTime);o.frequency.linearRampToValueAtTime(1300,actx.currentTime+0.18);g.gain.setValueAtTime(.0001,actx.currentTime);g.gain.exponentialRampToValueAtTime(.04,actx.currentTime+0.03);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+0.2);o.connect(g);g.connect(sfxGain||actx.destination);o.start();o.stop(actx.currentTime+0.2)}catch(e){}}

// ===== BACKGROUND MUSIC (synthesized, scheduled on the audio clock) =====
var music={on:false,timer:null,step:0,nextT:0};
// simple cheerful loop: bass note + arpeggio per step, minor-ish brainrot bop
var MUSIC_BASS=[131,131,147,98];// C3,C3,D3,G2 per bar
var MUSIC_ARP=[523,659,784,659, 523,622,784,622, 587,698,880,698, 392,587,784,587];// 16 steps
function musicStep(){
if(!actx||!music.on)return;
var t=actx.currentTime;
var step=music.step%16;
// arpeggio blip (routed to musicGain so it's part of "music" volume)
try{var o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=MUSIC_ARP[step];g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.05,t+0.02);g.gain.exponentialRampToValueAtTime(.001,t+0.18);o.connect(g);g.connect(musicGain);o.start(t);o.stop(t+0.2)}catch(e){}
// bass on every 4th step
if(step%4===0){try{var bo=actx.createOscillator(),bg=actx.createGain();bo.type='sawtooth';bo.frequency.value=MUSIC_BASS[(step/4)%4];bg.gain.setValueAtTime(.0001,t);bg.gain.exponentialRampToValueAtTime(.06,t+0.02);bg.gain.exponentialRampToValueAtTime(.001,t+0.32);bo.connect(bg);bg.connect(musicGain);bo.start(t);bo.stop(t+0.34)}catch(e){}}
music.step++;
}
function startMusic(){
if(!actx||music.on)return;
music.on=true;music.step=0;
try{musicGain.gain.cancelScheduledValues(actx.currentTime);musicGain.gain.setValueAtTime(musicGain.gain.value,actx.currentTime);musicGain.gain.linearRampToValueAtTime(0.6,actx.currentTime+0.8)}catch(e){}
music.timer=setInterval(musicStep,150);// ~100bpm-ish sixteenths
}
function stopMusic(){
if(!music.on)return;
music.on=false;
if(music.timer){clearInterval(music.timer);music.timer=null}
if(actx&&musicGain){try{musicGain.gain.cancelScheduledValues(actx.currentTime);musicGain.gain.setTargetAtTime(0,actx.currentTime,0.1)}catch(e){}}
}
function applyMute(){
try{localStorage.setItem('brrMuted',G.muted?'1':'0')}catch(e){}
if(actx&&masterGain){try{masterGain.gain.setTargetAtTime(G.muted?0:1,actx.currentTime,0.02)}catch(e){}}
var mb=document.getElementById('muteBtn');if(mb)mb.textContent=G.muted?'🔇':'🔊';
}
function toggleMute(){G.muted=!G.muted;applyMute()}

// ===== CHARACTERS =====
var CHARS=[
{name:'Tung Tung Sahur',abbr:'TT',color:'#ff3366',dark:'#aa1144',speed:7,accel:8,handling:6,skin:'bat'},
{name:'Tralalero Tralala',abbr:'TR',color:'#33ccff',dark:'#1188bb',speed:6,accel:7,handling:9,skin:'shark'},
{name:'Bombardiro Crocodilo',abbr:'BC',color:'#33ff66',dark:'#11aa33',speed:9,accel:5,handling:5,skin:'bomb'},
{name:'Cappuccino Assassino',abbr:'CA',color:'#ff9933',dark:'#bb6611',speed:5,accel:9,handling:7,skin:'coffee'},
{name:'Brr Brr Patapim',abbr:'BB',color:'#cc33ff',dark:'#8811bb',speed:8,accel:6,handling:8,skin:'tree'}
];

// ===== PSEUDO-3D CONSTANTS (OutRun-style projected segments) =====
var SEG_LEN=200;
var ROAD_W=2200;
var CAM_H=1500;
var FOV=100;
var CAM_DEPTH=1/Math.tan((FOV/2)*Math.PI/180);

// ===== PARTICLE POOL (allocated ONCE, never grows in loop) =====
var PARTICLE_MAX=80;
var particles=[];
(function(){for(var i=0;i<PARTICLE_MAX;i++)particles.push({active:false,x:0,y:0,vx:0,vy:0,life:0,maxLife:0,size:0,color:'#fff',kind:0})})();
function spawnParticle(x,y,vx,vy,life,size,color,kind){
for(var i=0;i<PARTICLE_MAX;i++){var p=particles[i];if(!p.active){
p.active=true;p.x=x;p.y=y;p.vx=vx;p.vy=vy;p.life=life;p.maxLife=life;p.size=size;p.color=color;p.kind=kind;return p;
}}
return null;
}
function updateParticles(dt){
var dtS=dt/1000;
for(var i=0;i<PARTICLE_MAX;i++){var p=particles[i];if(!p.active)continue;
p.life-=dt;
if(p.life<=0){p.active=false;continue}
p.x+=p.vx*dtS;p.y+=p.vy*dtS;
// gentle drag so smoke slows
p.vx*=(1-0.6*dtS);
}
}
function renderParticles(){
for(var i=0;i<PARTICLE_MAX;i++){var p=particles[i];if(!p.active)continue;
var t=p.life/p.maxLife;
var a=t*(p.kind===0?0.5:0.9);
var sz=p.size*(p.kind===0?(1.3-t*0.5):(0.6+t*0.6));
X.globalAlpha=a;
X.fillStyle=p.color;
X.beginPath();X.arc(p.x,p.y,sz,0,Math.PI*2);X.fill();
}
X.globalAlpha=1;
}

// ===== TRACKS =====
function buildTrack(spec){
var segs=[];var idx=0;
function easeInOut(a,b,p){return a+(b-a)*((-Math.cos(p*Math.PI)/2)+0.5)}
for(var i=0;i<spec.length;i++){
var s=spec[i];var len=s.len||1;var curve=s.curve||0;var hill=s.hill||0;
for(var j=0;j<len;j++){
var p=j/len,pn=(j+1)/len;
function ce(t){if(t<.25)return easeInOut(0,1,t/.25);if(t>.75)return easeInOut(1,0,(t-.75)/.25);return 1}
var y1=hill*HILL_AMP*Math.sin(Math.PI*p);
var y2=hill*HILL_AMP*Math.sin(Math.PI*pn);
segs.push({index:idx++,curve:curve*ce(p),p1y:y1,p2y:y2});
}
}
return segs;
}

// ===== GAMEPAD (Gamepad API) - polled each frame, merged into input flags =====
var pad={l:false,r:false,g:false,b:false,boost:false,drift:false};
function pollGamepad(){
pad.l=pad.r=pad.g=pad.b=pad.boost=pad.drift=false;
if(!navigator.getGamepads)return;
var gps=navigator.getGamepads();if(!gps)return;
var gp=null;
for(var i=0;i<gps.length;i++){if(gps[i]){gp=gps[i];break}}
if(!gp)return;
var btn=gp.buttons||[];
function pressed(idx){var b=btn[idx];return b?(typeof b==='object'?b.pressed||b.value>0.4:b>0.4):false}
// steering: left stick X (axis 0) or dpad (buttons 14/15)
var ax=gp.axes&&gp.axes.length>0?gp.axes[0]:0;
if(ax<-0.3||pressed(14))pad.l=true;
if(ax>0.3||pressed(15))pad.r=true;
// gas: A (0) or right trigger (7); brake: B (1) or left trigger (6)
if(pressed(0)||pressed(7))pad.g=true;
if(pressed(1)||pressed(6))pad.b=true;
// boost: X (2) or right shoulder (5)
if(pressed(2)||pressed(5))pad.boost=true;
// drift: left shoulder (4) or Y (3)
if(pressed(4)||pressed(3))pad.drift=true;
}

}

// sun/moon per track

if(_ti===0){
// yellow sun top-right
X.fillStyle='rgba(255,240,80,.9)';X.beginPath();X.arc(W*0.82,H*0.1,H*0.045,0,Math.PI*2);X.fill();
X.fillStyle='rgba(255,255,180,.25)';X.beginPath();X.arc(W*0.82,H*0.1,H*0.08,0,Math.PI*2);X.fill();
}else if(_ti===1){
// white moon top-left
X.fillStyle='rgba(230,230,245,.85)';X.beginPath();X.arc(W*0.18,H*0.09,H*0.035,0,Math.PI*2);X.fill();
X.fillStyle='rgba(200,200,230,.15)';X.beginPath();X.arc(W*0.18,H*0.09,H*0.065,0,Math.PI*2);X.fill();
}else{
// large orange sun center-low for sunset
X.fillStyle='rgba(255,140,30,.7)';X.beginPath();X.arc(W*0.5,horizon*0.85,H*0.08,0,Math.PI*2);X.fill();
X.fillStyle='rgba(255,180,60,.2)';X.beginPath();X.arc(W*0.5,horizon*0.85,H*0.14,0,Math.PI*2);X.fill();
}
// clouds
X.fillStyle='rgba(255,255,255,.18)';
X.beginPath();X.ellipse(W*0.15,H*0.12,W*0.06,H*0.018,0,0,Math.PI*2);X.fill();
X.beginPath();X.ellipse(W*0.15+W*0.035,H*0.11,W*0.04,H*0.015,0,0,Math.PI*2);X.fill();
X.fillStyle='rgba(255,255,255,.14)';
X.beginPath();X.ellipse(W*0.42,H*0.08,W*0.055,H*0.016,0,0,Math.PI*2);X.fill();
X.beginPath();X.ellipse(W*0.42+W*0.03,H*0.072,W*0.035,H*0.013,0,0,Math.PI*2);X.fill();
X.fillStyle='rgba(255,255,255,.16)';
X.beginPath();X.ellipse(W*0.7,H*0.14,W*0.05,H*0.015,0,0,Math.PI*2);X.fill();
X.beginPath();X.ellipse(W*0.7+W*0.03,H*0.13,W*0.038,H*0.013,0,0,Math.PI*2);X.fill();
X.fillStyle='rgba(255,255,255,.12)';
X.beginPath();X.ellipse(W*0.88,H*0.1,W*0.04,H*0.012,0,0,Math.PI*2);X.fill();

X.fillStyle=track.grassD;X.fillRect(0,horizon,W,H-horizon);

// parallax mountains
renderParallax(track, playerX * 200 + segs[base].curve * 80);

var x=0;
var dx=-(segs[base].curve*basePercent)*CURVE_MUL;
var maxy=H;

for(var n=0;n<DRAW_DIST;n++){
var i=(base+n)%N;var seg=segs[i];
var looped=(base+n)>=N;
var camZ=position-(looped?TL:0);
var camX1=playerX*ROAD_W - x;
var camX2=playerX*ROAD_W - x - dx;
var p1=project(seg.p1y,seg.index*SEG_LEN,camX1,camZ);
var p2=project(seg.p2y,(seg.index+1)*SEG_LEN,camX2,camZ);
segProj[n]={x:p1.x,y:p1.y,scale:p1.scale,w:p1.w,drawn:false};
x+=dx;dx+=seg.curve*CURVE_MUL;

if(p1.dz<=CAM_DEPTH||p2.y>=maxy||p2.y>=p1.y){continue}
maxy=p2.y;
segProj[n].drawn=true;

var light=Math.floor(seg.index/RUMBLE_SEGS)%2===0;
var grass=light?track.grassL:track.grassD;
var road=light?track.roadL:track.roadD;
var rumble=light?track.rumbleL:track.rumbleD;

X.fillStyle=grass;X.fillRect(0,p2.y,W,p1.y-p2.y);
var r1=p1.w*1.18,r2=p2.w*1.18;
poly(p1.x-r1,p1.y,p1.x+r1,p1.y,p2.x+r2,p2.y,p2.x-r2,p2.y,rumble);
poly(p1.x-p1.w,p1.y,p1.x+p1.w,p1.y,p2.x+p2.w,p2.y,p2.x-p2.w,p2.y,road);
if(light){
var lw1=p1.w*0.04,lw2=p2.w*0.04;
poly(p1.x-lw1,p1.y,p1.x+lw1,p1.y,p2.x+lw2,p2.y,p2.x-lw2,p2.y,track.lane);
var o1=p1.w*0.5,o2=p2.w*0.5;
poly(p1.x-o1-lw1,p1.y,p1.x-o1+lw1,p1.y,p2.x-o2+lw2,p2.y,p2.x-o2-lw2,p2.y,'rgba(255,255,255,.35)');
poly(p1.x+o1-lw1,p1.y,p1.x+o1+lw1,p1.y,p2.x+o2+lw2,p2.y,p2.x+o2-lw2,p2.y,'rgba(255,255,255,.35)');
}
if(seg.index===0){
poly(p1.x-p1.w,p1.y,p1.x+p1.w,p1.y,p2.x+p2.w,p2.y,p2.x-p2.w,p2.y,'#ffffff');
}
}
}

function poly(x1,y1,x2,y2,x3,y3,x4,y4,col){
X.fillStyle=col;X.beginPath();
X.moveTo(x1,y1);X.lineTo(x2,y2);X.lineTo(x3,y3);X.lineTo(x4,y4);
X.closePath();X.fill();
}

// ===== SPRITES =====
// per-character skin detail drawn on top of the car body (cheap shapes, scales with w).
// cx,top = body top-center; w,h = body size. Caller has already applied lean/spin transform.
function drawSkin(ctx,skin,cx,top,w,h){
if(w<=20)return;// skip detail at distance to avoid clutter
ctx.save();
if(skin==='bat'){
// Tung Tung Sahur: wooden bat/drumstick across the roof + angry brows
ctx.strokeStyle='#7a4a18';ctx.lineCap='round';ctx.lineWidth=Math.max(2,w*0.12);
ctx.beginPath();ctx.moveTo(cx-w*0.34,top+h*0.02);ctx.lineTo(cx+w*0.30,top-h*0.16);ctx.stroke();
ctx.fillStyle='#5a3410';ctx.beginPath();ctx.arc(cx+w*0.30,top-h*0.16,w*0.1,0,Math.PI*2);ctx.fill();
// angry eyebrows on windshield
ctx.strokeStyle='#1a1a1a';ctx.lineWidth=Math.max(1.5,w*0.05);
ctx.beginPath();ctx.moveTo(cx-w*0.24,top+h*0.18);ctx.lineTo(cx-w*0.06,top+h*0.24);ctx.stroke();
ctx.beginPath();ctx.moveTo(cx+w*0.24,top+h*0.18);ctx.lineTo(cx+w*0.06,top+h*0.24);ctx.stroke();
}else if(skin==='shark'){
// Tralalero Tralala: shark fin on the roof
ctx.fillStyle='#2a6f9c';
ctx.beginPath();ctx.moveTo(cx-w*0.12,top+h*0.04);ctx.lineTo(cx+w*0.02,top-h*0.34);ctx.lineTo(cx+w*0.16,top+h*0.04);ctx.closePath();ctx.fill();
ctx.strokeStyle='#0e3a55';ctx.lineWidth=Math.max(1,w*0.03);ctx.stroke();
// little teeth line under windshield
ctx.fillStyle='#fff';
for(var ti=0;ti<4;ti++){var tx=cx-w*0.18+ti*w*0.12;ctx.beginPath();ctx.moveTo(tx,top+h*0.34);ctx.lineTo(tx+w*0.06,top+h*0.34);ctx.lineTo(tx+w*0.03,top+h*0.4);ctx.closePath();ctx.fill();}
}else if(skin==='bomb'){
// Bombardiro Crocodilo: black bomb with a sparking fuse on the roof
ctx.fillStyle='#222';ctx.beginPath();ctx.arc(cx,top-h*0.1,w*0.2,0,Math.PI*2);ctx.fill();
ctx.strokeStyle='#444';ctx.lineWidth=Math.max(1.5,w*0.05);
ctx.beginPath();ctx.moveTo(cx+w*0.05,top-h*0.26);ctx.quadraticCurveTo(cx+w*0.22,top-h*0.42,cx+w*0.16,top-h*0.5);ctx.stroke();
ctx.fillStyle='#ffcc33';ctx.beginPath();ctx.arc(cx+w*0.16,top-h*0.52,w*0.06,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#ff5500';ctx.beginPath();ctx.arc(cx+w*0.16,top-h*0.52,w*0.03,0,Math.PI*2);ctx.fill();
}else if(skin==='coffee'){
// Cappuccino Assassino: coffee cup lid + steam on the roof
ctx.fillStyle='#e8d3b0';ctx.fillRect(cx-w*0.16,top-h*0.18,w*0.32,h*0.16);
ctx.fillStyle='#6b3f17';ctx.fillRect(cx-w*0.2,top-h*0.06,w*0.4,h*0.06);
ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=Math.max(1,w*0.04);ctx.lineCap='round';
ctx.beginPath();ctx.moveTo(cx-w*0.06,top-h*0.2);ctx.quadraticCurveTo(cx-w*0.14,top-h*0.32,cx-w*0.06,top-h*0.44);ctx.stroke();
ctx.beginPath();ctx.moveTo(cx+w*0.06,top-h*0.2);ctx.quadraticCurveTo(cx+w*0.14,top-h*0.32,cx+w*0.06,top-h*0.44);ctx.stroke();
}else if(skin==='tree'){
// Brr Brr Patapim: leafy tree/wild hair tuft on the roof
ctx.fillStyle='#2f7a2f';
ctx.beginPath();ctx.arc(cx,top-h*0.12,w*0.17,0,Math.PI*2);ctx.fill();
ctx.beginPath();ctx.arc(cx-w*0.16,top-h*0.02,w*0.12,0,Math.PI*2);ctx.fill();
ctx.beginPath();ctx.arc(cx+w*0.16,top-h*0.02,w*0.12,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#46a046';ctx.beginPath();ctx.arc(cx-w*0.05,top-h*0.2,w*0.08,0,Math.PI*2);ctx.fill();
}
ctx.restore();
}
function drawCarSprite(cx,cyBottom,w,col,dark,abbr,lean,dist,spin,skin){
if(w<3)return;
lean=lean||0;dist=dist||0;spin=spin||0;
var h=w*1.25;
var top=cyBottom-h;
X.save();
// spin-out rotation overrides lean banking
if(spin!==0){
X.translate(cx,cyBottom-h*0.5);
X.rotate(spin);
X.translate(-cx,-(cyBottom-h*0.5));
}else if(lean!==0){
// lean/banking rotation
X.translate(cx,cyBottom);
X.rotate(lean*0.15);
X.translate(-cx,-cyBottom);
}
// shadow (scales and fades with distance)
var shAlpha=0.35*(1-dist*0.6);
var shScaleX=0.6+(1-dist)*0.15;
var shScaleY=0.16*(1-dist*0.4);
if(shAlpha>0.02){
X.fillStyle='rgba(0,0,0,'+shAlpha.toFixed(2)+')';
X.beginPath();X.ellipse(cx,cyBottom,w*shScaleX,w*shScaleY,0,0,Math.PI*2);X.fill();
}
// rounded car body with gradient
var bx=cx-w/2,by=top,bw=w,bh=h,r=w*0.18;
var bodyGrad=X.createLinearGradient(cx,top,cx,cyBottom);
bodyGrad.addColorStop(0,'rgba(255,255,255,.25)');
bodyGrad.addColorStop(0.15,col);
bodyGrad.addColorStop(0.75,dark);
bodyGrad.addColorStop(1,dark);
X.fillStyle=bodyGrad;
X.beginPath();
X.moveTo(bx+r,by);
X.arcTo(bx+bw,by,bx+bw,by+bh,r);
X.arcTo(bx+bw,by+bh,bx,by+bh,r*0.5);
X.arcTo(bx,by+bh,bx,by,r*0.5);
X.arcTo(bx,by,bx+bw,by,r);
X.closePath();X.fill();
// windshield
X.fillStyle='rgba(180,210,255,.55)';
X.beginPath();
var wx=cx-w*0.32,wy=top+h*0.12,ww=w*0.64,wh=h*0.22,wr=w*0.08;
X.moveTo(wx+wr,wy);
X.arcTo(wx+ww,wy,wx+ww,wy+wh,wr);
X.arcTo(wx+ww,wy+wh,wx,wy+wh,wr);
X.arcTo(wx,wy+wh,wx,wy,wr);
X.arcTo(wx,wy,wx+ww,wy,wr);
X.closePath();X.fill();
// wheels (ellipses with hub center)
var wheelY=top+h*0.6;
var wheelW=w*0.13,wheelH=h*0.22;
var hubR=wheelW*0.35;
// left wheel
X.fillStyle='#111';
X.beginPath();X.ellipse(cx-w/2-w*0.02,wheelY,wheelW,wheelH,0,0,Math.PI*2);X.fill();
X.fillStyle='#888';
X.beginPath();X.ellipse(cx-w/2-w*0.02,wheelY,hubR,hubR,0,0,Math.PI*2);X.fill();
// right wheel
X.fillStyle='#111';
X.beginPath();X.ellipse(cx+w/2+w*0.02,wheelY,wheelW,wheelH,0,0,Math.PI*2);X.fill();
X.fillStyle='#888';
X.beginPath();X.ellipse(cx+w/2+w*0.02,wheelY,hubR,hubR,0,0,Math.PI*2);X.fill();
// outline
X.strokeStyle='rgba(0,0,0,.5)';X.lineWidth=Math.max(1,w*0.025);
X.beginPath();
X.moveTo(bx+r,by);
X.arcTo(bx+bw,by,bx+bw,by+bh,r);
X.arcTo(bx+bw,by+bh,bx,by+bh,r*0.5);
X.arcTo(bx,by+bh,bx,by,r*0.5);
X.arcTo(bx,by,bx+bw,by,r);
X.closePath();X.stroke();
// per-character meme skin detail on top of the body
if(skin)drawSkin(X,skin,cx,top,w,h);
// stylized name tag: chunky meme font in a colored pill above the car
if(w>26){
var fs=Math.round(w*0.34);
X.font='900 '+fs+'px "Arial Black",Impact,sans-serif';X.textAlign='center';X.textBaseline='middle';
var tw=X.measureText(abbr).width;
var padX=fs*0.34,pw=tw+padX*2,ph=fs*1.18,ty=top-ph*0.62,pr=ph*0.42;
var px0=cx-pw/2,py0=ty-ph/2;
// pill background (dark) with character-color border
X.fillStyle='rgba(0,0,0,.72)';
X.beginPath();
X.moveTo(px0+pr,py0);
X.arcTo(px0+pw,py0,px0+pw,py0+ph,pr);
X.arcTo(px0+pw,py0+ph,px0,py0+ph,pr);
X.arcTo(px0,py0+ph,px0,py0,pr);
X.arcTo(px0,py0,px0+pw,py0,pr);
X.closePath();X.fill();
X.lineWidth=Math.max(1.5,w*0.035);X.strokeStyle=col;X.stroke();
// text with black outline + character-color fill for accent
X.lineWidth=Math.max(2,fs*0.16);X.strokeStyle='#000';X.lineJoin='round';X.strokeText(abbr,cx,ty+1);
X.fillStyle='#fff';X.fillText(abbr,cx,ty);
X.textBaseline='alphabetic';
}
X.restore();
}

function drawTree(cx,cyBottom,w,track,treeType){
if(w<3)return;
treeType=treeType||0;
var h=w*2.2;
// shadow
X.fillStyle='rgba(0,0,0,.3)';X.beginPath();X.ellipse(cx,cyBottom,w*0.5,w*0.14,0,0,Math.PI*2);X.fill();
if(treeType===1){
// Pine/conifer: triangular layers with trunk
X.fillStyle='#5a3a1a';X.fillRect(cx-w*0.1,cyBottom-h*0.3,w*0.2,h*0.3);
// three triangle layers
for(var ti=0;ti<3;ti++){
var ty=cyBottom-h*0.3-ti*h*0.2;
var tw=w*(0.7-ti*0.15);
var th=h*0.3;
var tGrad=X.createLinearGradient(cx,ty-th,cx,ty);
tGrad.addColorStop(0,track.treeTop);tGrad.addColorStop(1,track.treeCol);
X.fillStyle=tGrad;
X.beginPath();X.moveTo(cx,ty-th);X.lineTo(cx-tw,ty);X.lineTo(cx+tw,ty);X.closePath();X.fill();
}
}else if(treeType===2){
// Bush: low, wide, no visible trunk
var bh=h*0.4;
var bGrad=X.createLinearGradient(cx,cyBottom-bh,cx,cyBottom);
bGrad.addColorStop(0,track.treeTop);bGrad.addColorStop(1,track.treeCol);
X.fillStyle=bGrad;
X.beginPath();X.ellipse(cx,cyBottom-bh*0.35,w*0.9,bh*0.5,0,0,Math.PI*2);X.fill();
X.fillStyle=track.treeTop;
X.beginPath();X.ellipse(cx-w*0.3,cyBottom-bh*0.5,w*0.5,bh*0.35,0,0,Math.PI*2);X.fill();
X.beginPath();X.ellipse(cx+w*0.25,cyBottom-bh*0.45,w*0.45,bh*0.32,0,0,Math.PI*2);X.fill();
}else{
// Type 0: Round deciduous tree with gradient foliage
X.fillStyle='#5a3a1a';X.fillRect(cx-w*0.12,cyBottom-h*0.4,w*0.24,h*0.4);
var fGrad=X.createRadialGradient(cx-w*0.15,cyBottom-h*0.65,w*0.1,cx,cyBottom-h*0.55,w*0.7);
fGrad.addColorStop(0,track.treeTop);fGrad.addColorStop(1,track.treeCol);
X.fillStyle=fGrad;X.beginPath();X.arc(cx,cyBottom-h*0.55,w*0.7,0,Math.PI*2);X.fill();
X.fillStyle=track.treeTop;X.beginPath();X.arc(cx-w*0.2,cyBottom-h*0.65,w*0.45,0,Math.PI*2);X.fill();
}
}

function drawItemBox(cx,cyBottom,w,spin){

X.save();
X.translate(cx,cy);

}

function renderParallax(track,curveOffset){
var horizon=Math.round(H*0.45);
// derive mountain color from sky bottom (slightly darker)
var sb=track.skyBot;
// parse hex color and darken
var r0=parseInt(sb.slice(1,3),16),g0=parseInt(sb.slice(3,5),16),b0=parseInt(sb.slice(5,7),16);
var mr=Math.max(0,Math.round(r0*0.55)),mg=Math.max(0,Math.round(g0*0.55)),mb=Math.max(0,Math.round(b0*0.6));
var mtCol='rgb('+mr+','+mg+','+mb+')';
var mr2=Math.max(0,Math.round(r0*0.45)),mg2=Math.max(0,Math.round(g0*0.45)),mb2=Math.max(0,Math.round(b0*0.5));
var mtCol2='rgb('+mr2+','+mg2+','+mb2+')';
// background layer (farther, lighter mountains)
var peaks=[
{x:0.08,h:0.28,w:0.22},{x:0.25,h:0.35,w:0.2},{x:0.45,h:0.42,w:0.25},
{x:0.62,h:0.32,w:0.18},{x:0.78,h:0.38,w:0.22},{x:0.92,h:0.25,w:0.2}
];
var shift=-(curveOffset*0.15)%W;
X.fillStyle=mtCol;
X.beginPath();
X.moveTo(0,horizon);
for(var i=0;i<peaks.length;i++){
var p=peaks[i];
var px=(p.x*W*1.4+shift)%(W+200)-100;
var py=horizon-p.h*H*0.25;
var pw=p.w*W*0.8;
X.quadraticCurveTo(px-pw*0.3,py-H*0.02,px,py);
X.quadraticCurveTo(px+pw*0.3,py-H*0.01,px+pw*0.5,horizon);
}
X.lineTo(W,horizon);
X.closePath();X.fill();
// foreground layer (closer, darker mountains)
var peaks2=[
{x:0.12,h:0.18,w:0.18},{x:0.35,h:0.24,w:0.2},{x:0.55,h:0.2,w:0.22},
{x:0.72,h:0.28,w:0.19},{x:0.88,h:0.16,w:0.17}
];
var shift2=-(curveOffset*0.25)%W;
X.fillStyle=mtCol2;
X.beginPath();
X.moveTo(0,horizon);
for(var i=0;i<peaks2.length;i++){
var p=peaks2[i];
var px=(p.x*W*1.4+shift2)%(W+200)-100;
var py=horizon-p.h*H*0.18;
var pw=p.w*W*0.8;
X.quadraticCurveTo(px-pw*0.3,py,px,py);
X.quadraticCurveTo(px+pw*0.3,py+H*0.01,px+pw*0.5,horizon);
}
X.lineTo(W,horizon);
X.closePath();X.fill();
}

function renderSprites(track,racers,playerIdx){
var N=track.segs.length;var TL=N*SEG_LEN;
var player=racers[playerIdx];
var base=Math.floor(player.z/SEG_LEN)%N;if(base<0)base+=N;

var list=[];
function addSprite(absZ,offset,kind,data){
var segIdx=Math.floor(absZ/SEG_LEN)%N;if(segIdx<0)segIdx+=N;
var n=(segIdx-base+N)%N;
if(n>0&&n<DRAW_DIST&&segProj[n])list.push({n:n,offset:offset,kind:kind,data:data});
}
for(var i=0;i<racers.length;i++){if(i===playerIdx)continue;addSprite(racers[i].z,racers[i].offset,'car',racers[i])}
if(track.scenery)for(var i=0;i<track.scenery.length;i++){var s=track.scenery[i];addSprite(s.idx*SEG_LEN,s.offset,'tree',s)}
if(track.items)for(var i=0;i<track.items.length;i++){var it=track.items[i];if(!it.taken)addSprite(it.idx*SEG_LEN,it.offset,'item',it)}
for(var i=0;i<HAZARD_MAX;i++){var hz=hazardPool[i];if(hz.active)addSprite(hz.z,hz.offset,'hazard',hz)}

list.sort(function(a,b){return b.n-a.n});
for(var i=0;i<list.length;i++){
var sp=list[i];var pr=segProj[sp.n];
// skip sprites on segments hidden behind hills (prevents floating trees)
if(!pr.drawn)continue;
var sx=pr.x+pr.scale*(sp.offset*ROAD_W)*(W/2);
// size scales with perspective; clamp so nothing becomes giant or vanishes
var base=pr.scale*ROAD_W*(W/2);
if(sp.kind==='car'){
var cw=Math.max(8,Math.min(W*0.13, base*0.55));
drawCarSprite(sx,pr.y,cw,sp.data.ch.color,sp.data.ch.dark,sp.data.ch.abbr,sp.data._lean||0,sp.n/DRAW_DIST,sp.data._spinAng||0,sp.data.ch.skin);
}else if(sp.kind==='item'){
var iw=Math.max(6,Math.min(W*0.07, base*0.4));
drawItemBox(sx,pr.y,iw,sp.data.spin||0);
}else if(sp.kind==='hazard'){
var hw=Math.max(5,Math.min(W*0.05, base*0.32));
drawHazard(sx,pr.y,hw);
}else{
var tw=Math.max(5,Math.min(W*0.09, base*0.42*sp.data.h));
drawTree(sx,pr.y,tw,track,sp.data.type!=null?sp.data.type:(sp.data.idx%3));
}
}

var pcw=W*0.10;
var lean=(player._lean||0);
drawCarSprite(W/2+lean*W*0.04,H*0.93,pcw,player.ch.color,player.ch.dark,player.ch.abbr,lean,0,player._spinAng||0,player.ch.skin);
}

// ===== MINIMAP =====
function renderMinimap(track,racers){
var mmS=120,mx=W-mmS-12,my=H-mmS-12;
// panel
X.fillStyle='rgba(0,0,0,.6)';X.fillRect(mx,my,mmS,mmS);
X.strokeStyle='rgba(255,255,255,.4)';X.lineWidth=1;X.strokeRect(mx,my,mmS,mmS);
var segs=track.segs,n=segs.length;
if(!track._mm){
var ang=0,px=0,py=0,pts=[];
for(var i=0;i<n;i++){ang+=segs[i].curve*0.025;px+=Math.cos(ang);py+=Math.sin(ang);pts.push({x:px,y:py})}
var mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9;
for(var i=0;i<pts.length;i++){if(pts[i].x<mnx)mnx=pts[i].x;if(pts[i].x>mxx)mxx=pts[i].x;if(pts[i].y<mny)mny=pts[i].y;if(pts[i].y>mxy)mxy=pts[i].y}
track._mm={pts:pts,mnx:mnx,mxx:mxx,mny:mny,mxy:mxy};
}
var mm=track._mm;var rx=mm.mxx-mm.mnx||1,ry=mm.mxy-mm.mny||1;
var sc=Math.min((mmS-22)/rx,(mmS-22)/ry);
var ox=mx+(mmS-rx*sc)/2-mm.mnx*sc,oy=my+(mmS-ry*sc)/2-mm.mny*sc;
// build the closed path once per frame, reuse for casing + road strokes
function tracePath(){X.beginPath();for(var i=0;i<mm.pts.length;i++){var X2=ox+mm.pts[i].x*sc,Y2=oy+mm.pts[i].y*sc;i===0?X.moveTo(X2,Y2):X.lineTo(X2,Y2)}X.closePath()}
X.lineJoin='round';X.lineCap='round';
// dark casing (road border)
X.strokeStyle='rgba(20,20,25,.9)';X.lineWidth=7;tracePath();X.stroke();
// lighter road surface on top
X.strokeStyle='#9a9aa2';X.lineWidth=4;tracePath();X.stroke();
// center dashes for a road feel (cheap: short segment skips)
X.strokeStyle='rgba(255,255,255,.5)';X.lineWidth=1;X.setLineDash([2,5]);tracePath();X.stroke();X.setLineDash([]);
// start/finish tick at seg 0
var s0x=ox+mm.pts[0].x*sc,s0y=oy+mm.pts[0].y*sc;
X.fillStyle='#fff';X.fillRect(s0x-2,s0y-2,4,4);
// bots as dots, player as a directional arrow
function mapPos(r){var fz=r.z/SEG_LEN;var idx=Math.floor(fz)%n;if(idx<0)idx+=n;var fr=fz-Math.floor(fz);var idx2=(idx+1)%n;
return{x:ox+(mm.pts[idx].x+(mm.pts[idx2].x-mm.pts[idx].x)*fr)*sc,y:oy+(mm.pts[idx].y+(mm.pts[idx2].y-mm.pts[idx].y)*fr)*sc,idx:idx,idx2:idx2}}
for(var i=0;i<racers.length;i++){
var r=racers[i];if(r.isPlayer)continue;
var mp=mapPos(r);
X.fillStyle=r.ch.color;X.beginPath();X.arc(mp.x,mp.y,3,0,Math.PI*2);X.fill();
X.strokeStyle='rgba(0,0,0,.6)';X.lineWidth=1;X.stroke();
}
// player arrow last (on top)
var pl=racers[0];
if(pl){
var pp=mapPos(pl);
// heading = tangent of the track path at the player's position
var hx=mm.pts[pp.idx2].x-mm.pts[pp.idx].x,hy=mm.pts[pp.idx2].y-mm.pts[pp.idx].y;
var hAng=Math.atan2(hy,hx);
X.save();
X.translate(pp.x,pp.y);X.rotate(hAng);
X.fillStyle=pl.ch.color;X.strokeStyle='#fff';X.lineWidth=1.5;
X.beginPath();X.moveTo(7,0);X.lineTo(-4,-4.5);X.lineTo(-1.5,0);X.lineTo(-4,4.5);X.closePath();
X.fill();X.stroke();
X.restore();
}
}

// ===== SPEEDOMETER (canvas, bottom-left, drawn in screen space) =====
function renderSpeedometer(player){
if(!player)return;
var spdPct=player.speed/player.maxSpd;if(spdPct<0)spdPct=0;if(spdPct>1)spdPct=1;
var kmh=Math.round(spdPct*220);
var boosting=player.boostTimer>0;
// dimensions: compact, bottom-left, sits clear above the version tag (~bottom 4px,height ~14px)
var bw=Math.max(120,Math.min(190,W*0.26));
var bh=14;
var bx=14,by=H-bh-34;
X.save();
// label + readout
X.font='bold '+Math.round(bh*1.5)+'px "Arial Black",Impact,sans-serif';
X.textAlign='left';X.textBaseline='alphabetic';
X.fillStyle='rgba(0,0,0,.55)';X.fillText('  '+kmh+' km/h',bx+2,by-5);
X.fillStyle=boosting?'#ffdd33':'#fff';X.fillText(kmh+' km/h',bx,by-6);
// track casing
X.fillStyle='rgba(0,0,0,.6)';X.fillRect(bx-2,by-2,bw+4,bh+4);
// fill: green -> yellow -> red as speed climbs (or boost gold)
var fillCol=boosting?'#ffcc22':(spdPct<0.5?'#33dd55':(spdPct<0.8?'#ffd11a':'#ff4422'));
X.fillStyle='#222';X.fillRect(bx,by,bw,bh);
X.fillStyle=fillCol;X.fillRect(bx,by,bw*spdPct,bh);
// needle (vertical bar at current fill position)
var nx=bx+bw*spdPct;
X.fillStyle='#fff';X.fillRect(nx-1.5,by-3,3,bh+6);
// border + redline tick at 80%
X.strokeStyle='rgba(255,255,255,.55)';X.lineWidth=1;X.strokeRect(bx,by,bw,bh);
X.strokeStyle='rgba(255,60,40,.9)';X.lineWidth=1.5;
X.beginPath();X.moveTo(bx+bw*0.8,by);X.lineTo(bx+bw*0.8,by+bh);X.stroke();
X.restore();
}

// ===== UPDATE LOGIC =====
function activateBoost(r){
// shared by raw boost key and 'boost' item
if(r.boostTimer>0||r.boostCooldown>0)return false;
r.boostTimer=1200;r.boostCooldown=1200+1200;// active + cooldown after
sndBoost();
return true;
}

function updatePlayer(r,track,dt){
var dtS=dt/1000;var N=track.segs.length;var TL=N*SEG_LEN;

// timers tick even when finished so trails/cooldowns resolve cleanly
if(r.boostTimer>0)r.boostTimer-=dt;
if(r.boostCooldown>0)r.boostCooldown-=dt;
if(r.spinOut>0)r.spinOut-=dt;
if(G.crashSndTimer>0)G.crashSndTimer-=dt;

if(r.finished){r.speed*=0.96;r.z+=r.speed*dtS;if(r.z>=TL)r.z-=TL;return}
var gas=keys['arrowup']||keys['w']||touch.g||pad.g;
var brake=keys['arrowdown']||keys['s']||touch.b||pad.b;
var left=keys['arrowleft']||keys['a']||touch.l||pad.l;
var right=keys['arrowright']||keys['d']||touch.r||pad.r;
var useKey=keys[' ']||keys['shift']||touch.boost||pad.boost;
var drift=keys['z']||keys['control']||touch.drift||pad.drift;

// taunt: 'T' key or touch taunt button (edge-triggered)
var tauntKey=keys['t']||touch.taunt;
if(tauntKey&&!tauntPrev){doTaunt()}
tauntPrev=tauntKey;

// edge-trigger the use/boost key (press, not hold)
if(useKey&&!useKeyPrev){
if(r.item==='boost'){if(activateBoost(r))r.item=null;}
else if(r.item==='banana'){spawnHazard(r.z,r.offset,'banana');r.item=null;tone(200,.12,'square',.08);}
else{activateBoost(r);}// raw boost (no item) still works
}
useKeyPrev=useKey;

var boosting=r.boostTimer>0;
var effMax=r.maxSpd*(boosting?1.4:1);
var effAccel=r.accel*(boosting?1.6:1);

// spin-out from banana: kill control and slow hard
if(r.spinOut>0){
r.speed-=r.speed*2.2*dtS;
if(r.speed<r.maxSpd*0.12)r.speed=r.maxSpd*0.12;
r._lean=(r._lean||0)+(0-(r._lean||0))*0.1;
r._spinAng=((r._spinAng||0)+dtS*14)%(Math.PI*2);
r.z+=r.speed*dtS;
if(r.z>=TL){r.z-=TL;r.lap++;if(r.lap>=r.totalLaps&&!r.finished){r.finished=true;r.finishTime=G.raceTime;G.finishOrder.push({name:r.ch.name,abbr:r.ch.abbr,time:r.finishTime,isPlayer:true})}}
return;
}
r._spinAng=0;

if(boosting)r.speed+=effAccel*dtS;
else if(gas)r.speed+=r.accel*dtS;
else if(brake)r.speed-=r.accel*1.6*dtS;
else r.speed-=r.speed*0.7*dtS;
if(r.speed>effMax)r.speed=effMax;if(r.speed<0)r.speed=0;

var spdPct=r.speed/r.maxSpd;
// drift: while held + turning at speed, steer sharper + build drift charge for a mini-boost on release
var drifting=drift&&(left||right)&&spdPct>0.35;
var driftMul=drifting?1.7:1;
var steer=dtS*2.6*r.handling*(0.35+spdPct*0.65)*driftMul;
var lean=0;
if(left){r.offset-=steer;lean=-1}
if(right){r.offset+=steer;lean=1}
if(drifting){r.driftTime+=dt;r.driftDir=lean;lean*=1.6}
else{
// released after a sustained drift -> small speed boost + spark puff
if(r.driftTime>350){r.speed=Math.min(effMax*1.15,r.speed+r.maxSpd*0.18);sndBoost();
for(var dp=0;dp<4;dp++)spawnParticle(W/2+(Math.random()-0.5)*W*0.09,H*0.93,(Math.random()-0.5)*40,30+Math.random()*40,300+Math.random()*150,6+Math.random()*4,Math.random()<0.5?'#33ddff':'#ffffff',1);}
r.driftTime=0;r.driftDir=0;
}
r._lean=(r._lean||0)+((lean)-(r._lean||0))*0.2;

// drift smoke: hard turn + high speed (denser while actively drifting), throttled
if(lean!==0&&spdPct>0.5){
G.smokeTimer-=dt;
if(G.smokeTimer<=0){
G.smokeTimer=drifting?22:40;
// behind the rear wheels at W/2 +/- W*0.05
var sx=W/2+(Math.random()<0.5?-1:1)*W*0.05;
spawnParticle(sx,H*0.92,(Math.random()-0.5)*(drifting?50:30),-20-Math.random()*25,500+Math.random()*200,(drifting?9:7)+Math.random()*5,drifting?'#dddddd':'#bbbbbb',0);
}
}
// drift tire squeal: while drifting hard, throttled so it doesn't retrigger every frame
if(drifting){
G.driftSqTimer-=dt;
if(G.driftSqTimer<=0){G.driftSqTimer=260;sndDrift()}
}else G.driftSqTimer=0;

// boost fire trail behind car
if(boosting){
G.boostFxTimer-=dt;
if(G.boostFxTimer<=0){
G.boostFxTimer=25;
var fx=W/2+(Math.random()-0.5)*W*0.07;
var fc=Math.random()<0.5?'#ff8800':'#ffdd33';
spawnParticle(fx,H*0.93,(Math.random()-0.5)*40,30+Math.random()*40,300+Math.random()*150,6+Math.random()*5,fc,1);
}
}

var seg=findSeg(track,r.z);
r.offset-=dtS*spdPct*spdPct*seg.curve*CENTRIFUGAL;

if(Math.abs(r.offset)>1){
r.speed-=r.speed*1.2*dtS;if(r.speed<r.maxSpd*0.35)r.speed=r.maxSpd*0.35;
// going off-road at high speed kicks the camera + comedic crash sting (throttled)
if(spdPct>0.6&&G.shake<6){G.shake=8;
if(G.crashSndTimer<=0){G.crashSndTimer=900;sndCrash();spawnFText(pick(LINES_CRASH),W/2,H*0.7,'#ff5555',Math.max(18,W*0.034))}
}
}
if(r.offset>2)r.offset=2;if(r.offset<-2)r.offset=-2;

// collision with bots: bump apart and lose speed instead of passing through
for(var ci=0;ci<G.racers.length;ci++){
var o=G.racers[ci];if(o===r)continue;
var dzc=o.z-r.z;
if(dzc>TL/2)dzc-=TL;if(dzc<-TL/2)dzc+=TL;
if(Math.abs(dzc)<SEG_LEN*1.3&&Math.abs(o.offset-r.offset)<0.45){
r.offset+=(r.offset<o.offset?-1:1)*1.5*dtS;
if(r.speed>o.speed){r.speed=o.speed*0.85}
G.shake=Math.max(G.shake,10);
if(G.crashSndTimer<=0){G.crashSndTimer=700;sndCrash();spawnFText(pick(LINES_CRASH),W/2,H*0.72,'#ffaa33',Math.max(18,W*0.032))}
}
}

// hazard (banana) collision
for(var hi=0;hi<HAZARD_MAX;hi++){var hz=hazardPool[hi];if(!hz.active)continue;
var dzh=hz.z-r.z;if(dzh>TL/2)dzh-=TL;if(dzh<-TL/2)dzh+=TL;
if(Math.abs(dzh)<SEG_LEN*1.2&&Math.abs(hz.offset-r.offset)<0.4){
hz.active=false;r.spinOut=900;G.shake=Math.max(G.shake,9);sndCrash();spawnFText(pick(LINES_CRASH),W/2,H*0.72,'#ffdd33',Math.max(18,W*0.034));
}
}

r.z+=r.speed*dtS;
if(r.z>=TL){r.z-=TL;r.lap++;
if(r.lap>=r.totalLaps&&!r.finished){
r.finished=true;r.finishTime=G.raceTime;
G.finishOrder.push({name:r.ch.name,abbr:r.ch.abbr,time:r.finishTime,isPlayer:true});
// finish reaction based on current place
var fline=r.position===1?'GG EZ 🏆':(r.position===2?'so close':(r.position===3?'on the podium':'we ball next time'));
spawnFText(fline,W/2,H*0.6,r.position===1?'#ffd700':'#ffffff',Math.max(20,W*0.04));
}}

// item pickup
if(track.items){
for(var ii=0;ii<track.items.length;ii++){var box=track.items[ii];
if(box.taken)continue;
var bz=box.idx*SEG_LEN;var dzi=bz-r.z;if(dzi>TL/2)dzi-=TL;if(dzi<-TL/2)dzi+=TL;
if(Math.abs(dzi)<SEG_LEN&&Math.abs(box.offset-r.offset)<0.4){
box.taken=true;box.respawnTimer=5000;
if(!r.item)r.item=(Math.random()<0.5?'boost':'banana');
sndPickup();
}
}
}
}

function updateBot(r,track,dt){
var dtS=dt/1000;var N=track.segs.length;var TL=N*SEG_LEN;
if(r.spinOut>0)r.spinOut-=dt;
if(r.finished){r.speed*=0.96;r.z+=r.speed*dtS;if(r.z>=TL)r.z-=TL;return}

// hazard (banana) collision affects bots too
for(var hi=0;hi<HAZARD_MAX;hi++){var hz=hazardPool[hi];if(!hz.active)continue;
var dzh=hz.z-r.z;if(dzh>TL/2)dzh-=TL;if(dzh<-TL/2)dzh+=TL;
if(Math.abs(dzh)<SEG_LEN*1.2&&Math.abs(hz.offset-r.offset)<0.4){hz.active=false;r.spinOut=900}
}
if(r.spinOut>0){
r.speed-=r.speed*2.2*dtS;if(r.speed<r.maxSpd*0.12)r.speed=r.maxSpd*0.12;
r._spinAng=((r._spinAng||0)+dtS*14)%(Math.PI*2);
r.z+=r.speed*dtS;
if(r.z>=TL){r.z-=TL;r.lap++;if(r.lap>=r.totalLaps&&!r.finished){r.finished=true;r.finishTime=G.raceTime;G.finishOrder.push({name:r.ch.name,abbr:r.ch.abbr,time:r.finishTime,isPlayer:false})}}
return;
}
r._spinAng=0;

var diff=DIFFS[G.diff];
var seg=findSeg(track,r.z);
r.errTimer-=dt;
if(r.errTimer<=0){r.targetOff=r.laneBias+(Math.random()-0.5)*diff.errRate*40;r.errTimer=700+Math.random()*1100}
r.offset+=(r.targetOff-r.offset)*dtS*1.8;
var spdPct=r.speed/r.maxSpd;
r.offset-=dtS*spdPct*spdPct*seg.curve*CENTRIFUGAL*0.8;
if(r.offset>1.6)r.offset=1.6;if(r.offset<-1.6)r.offset=-1.6;
var target=r.maxSpd*diff.speedMul*Math.max(0.55,1-Math.abs(seg.curve)*0.06);
if(r.speed<target)r.speed+=r.accel*dtS;else r.speed+=(target-r.speed)*dtS*4;
if(r.speed<r.maxSpd*0.3)r.speed=r.maxSpd*0.3;
r.z+=r.speed*dtS;
if(r.z>=TL){r.z-=TL;r.lap++;
if(r.lap>=r.totalLaps&&!r.finished){
r.finished=true;r.finishTime=G.raceTime;
G.finishOrder.push({name:r.ch.name,abbr:r.ch.abbr,time:r.finishTime,isPlayer:false});
}}
}

function calcPositions(racers,track){
var TL=track.segs.length*SEG_LEN;
racers.forEach(function(r){r.progress=r.lap*TL+r.z});
var sorted=racers.slice().sort(function(a,b){
if(a.finished&&b.finished)return a.finishTime-b.finishTime;
if(a.finished)return-1;if(b.finished)return 1;
return b.progress-a.progress;
});
sorted.forEach(function(r,i){r.position=i+1});
}

// detect player position changes (overtakes) and pop a reaction above the player car
function detectOvertakes(){
var pl=G.racers[0];if(!pl)return;
if(pl._otPos===undefined){pl._otPos=pl.position;return}
if(!G.started||pl.finished){pl._otPos=pl.position;return}
if(pl.position<pl._otPos){
// gained a place -> celebratory taunt above the player
spawnFText(pick(LINES_OVERTAKE_GOOD),W/2,H*0.66,'#33ff66',Math.max(18,W*0.034));
}else if(pl.position>pl._otPos){
// got passed -> salty line
spawnFText(pick(LINES_OVERTAKE_BAD),W/2,H*0.66,'#ff5555',Math.max(18,W*0.032));
}
pl._otPos=pl.position;
}

function updateItems(track,dt){
if(!track.items)return;
for(var i=0;i<track.items.length;i++){var box=track.items[i];
box.spin=(box.spin||0)+dt*0.004;// constant slow spin
if(box.taken){box.respawnTimer-=dt;if(box.respawnTimer<=0){box.taken=false;box.respawnTimer=0}}
}
}

// ===== MAIN LOOP =====
var lastTime=0;
function loop(time){
var dt=Math.min(time-lastTime,50);lastTime=time;

if(G.scr==='race'){
resize();
pollGamepad();
var track=TRACKS[G.selTrack];

if(G.cdVal>0){
G.cdTimer+=dt;
if(G.cdTimer>=1000){
G.cdTimer=0;G.cdVal--;
var cd=document.getElementById('countdown');
if(G.cdVal>0){cd.textContent=G.cdVal;sndCount(false)}
else{cd.textContent='GO!';sndCount(true);G.started=true;startMusic();startEngine();setTimeout(function(){cd.style.display='none'},500)}
cd.classList.remove('cdpop');void cd.offsetWidth;cd.classList.add('cdpop');
}
}

G.bobTime+=dt/1000;
updateParticles(dt);
updateFTexts(dt);
updateItems(track,dt);
// screen shake decays exponentially toward 0
if(G.shake>0){G.shake-=dt*0.02;if(G.shake<0)G.shake=0}
if(G.started&&!G.finished){
G.raceTime+=dt;
G.engTimer+=dt;
var player=G.racers[0];
updatePlayer(player,track,dt);
for(var i=1;i<G.racers.length;i++)updateBot(G.racers[i],track,dt);
calcPositions(G.racers,track);
detectOvertakes();
if(G.engTimer>80){G.engTimer=0;sndEngine(player.speed)}
if(!G.finished&&G.racers[0].finished){
G.finished=true;setTimeout(function(){G.showResults()},2000);
}
}

try{
var player=G.racers[0];
var spd=player?player.speed/player.maxSpd:0;
// camera shake offset + speed-tied vertical bob (combined, small amplitude)
var shx=(Math.random()-0.5)*G.shake*2;
var shy=(Math.random()-0.5)*G.shake*2;
var bob=Math.sin(G.bobTime*8)*Math.min(4,spd*4);
// boost FOV punch: brief zoom-in surge while boosting (eased), never exposes borders
var boostT=player&&player.boostTimer>0?Math.min(1,player.boostTimer/1200):0;
var fovScale=1+0.06*Math.sin(boostT*Math.PI);
// world (road + sprites) drawn under shake/bob (+ boost zoom) transform
X.setTransform(1,0,0,1,0,0);
// clear to black so shake/bob never exposes a stale-frame edge strip
if(G.shake>0.5||bob!==0){X.fillStyle='#000';X.fillRect(0,0,W,H)}
X.translate(Math.round(shx),Math.round(shy+bob));
if(fovScale!==1){X.translate(W/2,H/2);X.scale(fovScale,fovScale);X.translate(-W/2,-H/2)}
renderRoad(track,player.z,player.offset);
renderSprites(track,G.racers,0);
// overlays in screen space (no shake/bob): speed lines, particles, minimap, HUD item
X.setTransform(1,0,0,1,0,0);
renderSpeedLines(spd);
renderParticles();
renderFTexts();
renderMinimap(track,G.racers);
renderSpeedometer(player);
renderHudItem(player);
}catch(err){
X.setTransform(1,0,0,1,0,0);
if(!renderErr){renderErr='Render error: '+err.message;showRenderErr()}
X.fillStyle='#226';X.fillRect(0,0,W,H);
X.fillStyle='#fff';X.font='20px sans-serif';X.textAlign='center';
X.fillText('Render error: '+err.message,W/2,H/2);
X.fillText('W='+W+' H='+H+' z='+(G.racers[0]?Math.round(G.racers[0].z):'?'),W/2,H/2+30);
}

var pl0=G.racers[0];
var curPos=(pl0&&pl0.position)||1;
var curLap=pl0?pl0.lap:0;
var hposEl=document.getElementById('hpos'),hlapEl=document.getElementById('hlap');
hposEl.textContent=posStr(curPos);
hlapEl.textContent='Lap '+Math.min(curLap+1,3)+'/3';
document.getElementById('htime').textContent=fmtTime(G.raceTime);
// lap pop when the player starts a new lap
if(G.started&&curLap!==G.prevLap){
hlapEl.classList.remove('lappop');void hlapEl.offsetWidth;hlapEl.classList.add('lappop');
setTimeout(function(){hlapEl.classList.remove('lappop')},430);
G.prevLap=curLap;
}
// position flash/shake: green if improved (lower number), red if dropped
if(G.started&&curPos!==G.prevPos){
var improved=curPos<G.prevPos;
hposEl.classList.remove('posup','posdown');void hposEl.offsetWidth;
hposEl.classList.add(improved?'posup':'posdown');
setTimeout(function(){hposEl.classList.remove('posup','posdown')},470);
G.prevPos=curPos;
}
}

requestAnimationFrame(loop);
}

// ===== STARTUP: load persisted mute preference =====
(function(){
try{G.muted=localStorage.getItem('brrMuted')==='1'}catch(e){G.muted=false}
var mb=document.getElementById('muteBtn');if(mb)mb.textContent=G.muted?'🔇':'🔊';
})();

requestAnimationFrame(loop);
</script>
</body>
</html>
