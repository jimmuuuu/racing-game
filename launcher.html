<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>BRAINROT RACING - Loader</title>
<style>
html,body{margin:0;height:100%;background:#0a0a1a;color:#fff;font-family:'Segoe UI',sans-serif;overflow:hidden}
#status{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.t{font-size:28px;font-weight:900;text-shadow:0 0 20px #f0f,0 0 40px #0ff;margin-bottom:14px}
.m{font-size:15px;color:#9cf}
.err{color:#f66;font-size:14px;margin-top:12px;max-width:80vw}
.btn{margin-top:18px;background:linear-gradient(135deg,#ff006e,#8338ec);color:#fff;border:none;padding:10px 24px;font-size:15px;border-radius:10px;cursor:pointer;font-weight:700}
</style>
</head>
<body>
<div id="status">
<div class="t">BRAINROT RACING</div>
<div class="m" id="msg">Loading latest version…</div>
<div class="err" id="err"></div>
</div>
<script>
// This loader always fetches the newest game code from GitHub, bypassing
// any cached copy. Save it once; every time you open it you get the latest.
var SRC='https://raw.githubusercontent.com/jimmuuuu/racing-game/claude/sleepy-bell-2z5nua/index.html';
var url=SRC+'?cb='+Date.now(); // unique each load so no proxy can cache it
fetch(url,{cache:'no-store'})
.then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text()})
.then(function(html){
document.open();
document.write(html);
document.close();
})
.catch(function(e){
document.getElementById('msg').textContent='Could not load the latest version.';
document.getElementById('err').textContent='('+e.message+') Your school network may be blocking GitHub. Try again, or use the saved copy.';
var b=document.createElement('button');b.className='btn';b.textContent='Retry';b.onclick=function(){location.reload()};
document.getElementById('status').appendChild(b);
});
</script>
</body>
</html>
